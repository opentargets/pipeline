---
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.85
    hooks:
      - id: ty
        name: ty orchestration
        args: [--directory, orchestration]
        files: ^orchestration/
        always_run: false
      - id: ty
        name: ty pis
        args: [--directory, pis]
        files: ^pis/
        always_run: false
      - id: ty
        name: ty pts
        args: [--directory, pts]
        files: ^pts/
        always_run: false
      - id: ty
        name: ty pos
        args: [--directory, pos]
        files: ^pos/
        always_run: false
      - id: ty
        name: ty datamodels
        args: [--directory, datamodels]
        files: ^datamodels/
        always_run: false

  # vulture warns about dead code but never fails: the entry swallows its exit code
  - repo: local
    hooks:
      - id: vulture
        name: vulture orchestration
        entry: bash -c 'cd orchestration && uv run --frozen vulture || true'
        language: system
        files: ^orchestration/.*\.(py|toml)$
        pass_filenames: false
        verbose: true
      - id: vulture
        name: vulture pis
        entry: bash -c 'cd pis && uv run --frozen vulture || true'
        language: system
        files: ^pis/.*\.(py|toml)$
        pass_filenames: false
        verbose: true
      - id: vulture
        name: vulture pts
        entry: bash -c 'cd pts && uv run --frozen vulture || true'
        language: system
        files: ^pts/.*\.(py|toml)$
        pass_filenames: false
        verbose: true
      - id: vulture
        name: vulture pos
        entry: bash -c 'cd pos && uv run --frozen vulture || true'
        language: system
        files: ^pos/.*\.(py|toml)$
        pass_filenames: false
        verbose: true

  - repo: https://github.com/google/yamlfmt
    rev: v0.21.0
    hooks:
      - id: yamlfmt
        args: [-conf, '.yamlfmt', '-lint']
        exclude: ^pos/(config|deployment)/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: pretty-format-json
        args: [--no-sort-keys]
        files: ^pos/src/pos/croissant/assets/
