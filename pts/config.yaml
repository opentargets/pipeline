---
work_path: ../work
log_level: DEBUG
pool_size: 4

scratchpad:
  string_version: '12.0'

steps:
  #: DISEASE STEP :#################################################################################
  disease:
    - name: transform disease_efo
      source: input/disease/efo_otar_slim.json
      destination: output/disease
      transformer: disease

    - name: transform disease_hpo
      source: input/disease/hp-full.json
      destination: output/disease_hpo
      transformer: disease_hpo

    - name: transform disease_phenotype
      requires:
        - transform disease_efo
      source:
        disease_path: output/disease
        phenotype_path: input/disease/phenotype.hpoa
        mondo_path: input/disease/mondo.json
      destination: output/disease_phenotype
      transformer: disease_phenotype
  ##################################################################################################

  #: GO STEP :######################################################################################
  go:
    - name: transform go
      transformer: go
      source: input/go/go.obo
      destination: output/go
  ##################################################################################################

  #: OTAR STEP :####################################################################################
  otar:
    - name: transform otar
      transformer: otar
      source:
        diseases: output/disease
        otar_meta: input/otar/otar_meta.csv
        otar_project_to_efo: input/otar/otar_project_to_efo.csv
      destination: output/otar
  ##################################################################################################

  #: REACTOME STEP :################################################################################
  reactome:
    - name: transform reactome
      transformer: reactome
      source:
        pathways: input/reactome/ReactomePathways.txt
        relations: input/reactome/ReactomePathwaysRelation.txt
      destination: output/reactome
  ##################################################################################################

  #: BIOSAMPLE STEP :###############################################################################
  biosample:
    - name: transform biosample
      transformer: biosample
      source:
        cell_ontology: input/biosample/cl.json
        uberon: input/biosample/uberon.json
        efo: input/biosample/efo.json
      destination: output/biosample
  ##################################################################################################

  #: EXPRESSION STEP :##############################################################################
  baseline_expression_dice:
    - name: pyspark baseline expression harmonise dice
      pyspark: baseline_expression_harmonise
      source:
        dice_directory: input/baseline_expression/bulkRNAseq/DICE
        mapping_path: input/baseline_expression/bulkRNAseq/DICE/DICE_ontology_mapping.txt
      destination:
        baseline_expression: intermediate/baseline_expression/unaggregated/DICE/celltype
      settings:
        harmoniser: dice
    - name: pyspark baseline expression specificity dice
      pyspark: baseline_expression_specificity
      source: intermediate/baseline_expression/unaggregated/DICE/celltype
      destination: intermediate/baseline_expression/specificity/DICE/celltype
      settings:
        specificity_method: cellex
        biosample: celltype
      requires:
        - pyspark baseline expression harmonise dice
    - name: pyspark baseline expression aggregate dice
      pyspark: baseline_expression_aggregate
      source:
        expression_data: intermediate/baseline_expression/unaggregated/DICE/celltype/parquet
        celltype_cellex: intermediate/baseline_expression/specificity/DICE/celltype/cellex/esmu.csv.gz
      destination: intermediate/baseline_expression/aggregated/DICE/celltype/
      requires:
        - pyspark baseline expression harmonise dice
        - pyspark baseline expression specificity dice

  baseline_expression_cellxgene:
    - name: pyspark baseline expression harmonise cellxgene
      pyspark: baseline_expression_harmonise
      source:
        h5ad_path: input/baseline_expression/scRNAseq/CxG-tabula_sapiens.h5ad
      destination:
        baseline_expression: intermediate/baseline_expression/unaggregated/tabula_sapiens/
      settings:
        harmoniser: cellxgene
        datasource_id: tabula_sapiens
        datatype_id: scrna-seq
        min_cells: 5 # Minimum cells a gene must be expressed in to be retained
        min_genes: 5 # Minimum genes a cell must express to be retained
        technology: 10X # Technology used to generate the data
        normalise: true
        aggregation_min_cells: 5 # Minimum cells required per pseudobulked sample
        aggregation_method: sum # Options: sum, mean
        tissue_agg_colname: tissue_ontology_term_id
        celltype_agg_colname: cell_type_ontology_term_id
        age_colname: development_stage
        sex_colname: sex
        ethnicity_colname: self_reported_ethnicity
        donor_colname: donor_id
    - name: pyspark baseline expression specificity celltype
      pyspark: baseline_expression_specificity
      source: intermediate/baseline_expression/unaggregated/tabula_sapiens/celltype
      destination: intermediate/baseline_expression/specificity/tabula_sapiens/celltype
      settings:
        specificity_method: cellex
        biosample: celltype
      requires:
        - pyspark baseline expression harmonise cellxgene
    - name: pyspark baseline expression specificity tissue
      pyspark: baseline_expression_specificity
      source: intermediate/baseline_expression/unaggregated/tabula_sapiens/tissue
      destination: intermediate/baseline_expression/specificity/tabula_sapiens/tissue
      settings:
        specificity_method: cellex
        biosample: tissue
      requires:
        - pyspark baseline expression harmonise cellxgene
    - name: pyspark baseline expression specificity tissue celltype
      pyspark: baseline_expression_specificity
      source: intermediate/baseline_expression/unaggregated/tabula_sapiens/tissue_celltype
      destination: intermediate/baseline_expression/specificity/tabula_sapiens/tissue_celltype
      settings:
        specificity_method: cellex
        biosample: tissuecelltype
      requires:
        - pyspark baseline expression harmonise cellxgene
    - name: pyspark baseline expression aggregate celltype
      pyspark: baseline_expression_aggregate
      source:
        expression_data: intermediate/baseline_expression/unaggregated/tabula_sapiens/celltype/parquet
        celltype_cellex: intermediate/baseline_expression/specificity/tabula_sapiens/celltype/cellex/esmu.csv.gz
      destination: intermediate/baseline_expression/aggregated/tabula_sapiens/celltype
      requires:
        - pyspark baseline expression harmonise cellxgene
        - pyspark baseline expression specificity celltype
    - name: pyspark baseline expression aggregate tissue
      pyspark: baseline_expression_aggregate
      source:
        expression_data: intermediate/baseline_expression/unaggregated/tabula_sapiens/tissue/parquet
        tissue_cellex: intermediate/baseline_expression/specificity/tabula_sapiens/tissue/cellex/esmu.csv.gz
      destination: intermediate/baseline_expression/aggregated/tabula_sapiens/tissue
      requires:
        - pyspark baseline expression harmonise cellxgene
        - pyspark baseline expression specificity tissue
    - name: pyspark baseline expression aggregate tissue celltype
      pyspark: baseline_expression_aggregate
      source:
        expression_data: intermediate/baseline_expression/unaggregated/tabula_sapiens/tissue_celltype/parquet
        tissue_celltype_cellex: intermediate/baseline_expression/specificity/tabula_sapiens/tissue_celltype/cellex/esmu.csv.gz
      destination: intermediate/baseline_expression/aggregated/tabula_sapiens/tissue_celltype
      requires:
        - pyspark baseline expression harmonise cellxgene
        - pyspark baseline expression specificity tissue celltype

  baseline_expression_pride:
    - name: pyspark baseline expression harmonise pride
      pyspark: baseline_expression_harmonise
      source:
        pride_directory: input/baseline_expression/MSproteomics/PRIDE
        tissue_ontology_mapping_path: input/baseline_expression/MSproteomics/PRIDE/tissue-complete_mapping.tsv
      destination:
        baseline_expression: intermediate/baseline_expression/unaggregated/PRIDE/tissue
      settings:
        harmoniser: pride
        pride_codes:
          - PXD020192
          - PXD000865
          - PXD000561
          - PXD016999
    - name: pyspark baseline expression aggregate pride
      pyspark: baseline_expression_aggregate
      source:
        expression_data: intermediate/baseline_expression/unaggregated/PRIDE/tissue/parquet
      destination: intermediate/baseline_expression/aggregated/PRIDE/tissue
      requires:
        - pyspark baseline expression harmonise pride

  baseline_expression_gtex:
    - name: pyspark baseline expression harmonise gtex
      pyspark: baseline_expression_harmonise
      source:
        gtex_source_data_path: input/baseline_expression/bulkRNAseq/GTEx/gene_tpm.gct.gz
        sample_metadata_path: input/baseline_expression/bulkRNAseq/GTEx/sample_attributes.txt
        subject_metadata_path: input/baseline_expression/bulkRNAseq/GTEx/subject_phenotypes.txt
      destination:
        baseline_expression: intermediate/baseline_expression/unaggregated/GTEx/tissue
      settings:
        harmoniser: gtex
        matrix: true # Generate a matrix as well as a parquet (true or false)
    - name: pyspark baseline expression specificity gtex
      pyspark: baseline_expression_specificity
      source: intermediate/baseline_expression/unaggregated/GTEx/tissue
      destination: intermediate/baseline_expression/specificity/GTEx/tissue
      settings:
        specificity_method: cellex
        biosample: tissue
        input_format: true
        mode: matrix
        sample_id: OrigSample
      requires:
        - pyspark baseline expression harmonise gtex
    - name: pyspark baseline expression aggregate gtex
      pyspark: baseline_expression_aggregate
      source:
        expression_data: intermediate/baseline_expression/unaggregated/GTEx/tissue/parquet
        tissue_cellex: intermediate/baseline_expression/specificity/GTEx/tissue/cellex/esmu.csv.gz
      destination: intermediate/baseline_expression/aggregated/GTEx/tissue
      requires:
        - pyspark baseline expression harmonise gtex
        - pyspark baseline expression specificity gtex

  baseline_expression:
    - name: pyspark baseline expression aggregated
      pyspark: baseline_expression
      source:
        baseline_expression: intermediate/baseline_expression
        target_index: output/target
        biosample_index: output/biosample
        tissue_parents: input/baseline_expression/tissue-parent_mapping.tsv
        celltype_parents: input/baseline_expression/celltype-parent_mapping.tsv
      destination:
        valid: output/baseline_expression
        failed: excluded/baseline_expression
      settings:
        partition_count: 39
        aggregation: aggregated
        datasets:
          - GTEx/tissue
          - PRIDE/tissue
          - tabula_sapiens/celltype
          - tabula_sapiens/tissue
          - tabula_sapiens/tissue_celltype
          - DICE/celltype
  ##################################################################################################

  #: MOUSE_PHENOTYPES STEP :########################################################################
  mouse_phenotype:
    - name: pyspark generate from IMPC and validate with target
      pyspark: mouse_phenotype
      settings:
        partition_count: 1
      source:
        target: output/target
        # IMPC source files
        solr_gene_gene: input/impc/gene_gene.csv
        solr_mouse_model: input/impc/mouse_model.csv
        solr_disease_model_summary: input/impc/disease_model_summary.csv
        solr_ontology: input/impc/ontology.csv
        hgnc_gene_mappings: input/target/genenames/hgnc_complete_set.tsv
        mouse_gene_mappings: input/impc/MGI_Gene_Model_Coord.rpt
        mouse_pubmed_refs: input/impc/MGI_PhenoGenoMP.rpt
        mp_ontology: input/impc/mp.json
      destination:
        output: output/mouse_phenotype
        excluded: excluded/mouse_phenotype
  ##################################################################################################

  #: CHEMICAL PROBES STEP :#########################################################################
  chemical_probes:
    - name: transform chemical probes
      transformer: chemical_probes
      source:
        probes_excel: input/target/chemicalprobes/probes.xlsx
        drugs_csv: input/target/chemicalprobes/probes_links.csv
        chembl_molecule: intermediate/chembl_molecule
        target: output/target
      destination: output/chemical_probe
  ##################################################################################################

  #: CODING VARIANT STEP :##########################################################################
  coding_variant:
    - name: transform coding_variant view
      transformer: coding_variant
      source:
        variant: output/variant
        target: output/target
        disease: output/disease
        evidence_eva: output/evidence_eva
        evidence_eva_somatic: output/evidence_eva_somatic
        evidence_uniprot_variant: output/evidence_uniprot_variants
        evidence_gwas_credible_set: output/evidence_gwas_credible_sets
        credible_set: output/credible_set
        pharmacogenetics: output/pharmacogenomics
      destination: view/coding_variant
  ##################################################################################################

  #: OPENFDA STEP :#################################################################################
  openfda_input_preparation:
    - name: explode_glob transform openfda drug events
      glob: input/openfda/**/*.zip
      do:
        - name: transform ${match_path}/${match_stem}
          source: ${uri}
          destination: intermediate/openfda/${uuid}.parquet
          transformer: openfda

  openfda:
    - name: pyspark openfda
      pyspark: openfda
      source:
        drug_molecule: output/drug_molecule
        fda_data: intermediate/openfda/*.parquet
        blacklisted_events: input/openfda/blacklisted_events.txt
      destination:
        fda_unfiltered: intermediate/openfda_adverse_drug_reactions
        fda_results: output/openfda_significant_adverse_drug_reactions
      settings:
        montecarlo_permutations: 500
        montecarlo_percentile: 0.95
  ##################################################################################################

  #: SO STEP :######################################################################################
  so:
    - name: transform so
      source: input/so/so.json
      destination: output/so
      transformer: so
  ##################################################################################################

  #: PRE_TARGET STEP :##############################################################################
  pre_target:
    - name: unzip subcellular location
      source: input/target/hpa/subcellular_location.tsv.zip
      destination: intermediate/target/hpa/subcellular_location.tsv
    - name: gzip subcellular location
      requires:
        - unzip subcellular location
      source: intermediate/target/hpa/subcellular_location.tsv
      destination: intermediate/target/hpa/subcellular_location.tsv.gz

    - name: csv_to_parquet subcellular location ssl
      source: input/target/hpa/subcellular_locations_ssl.tsv
      destination: intermediate/target/hpa/subcellular_locations_ssl.parquet
      separator: "\t"

    # gnomAD ships the constraint metrics bgzip-compressed. Converting to parquet
    # here keeps the decompression off the spark cluster; `infer_schema: false`
    # preserves the raw text the target step parses itself.
    - name: csv_to_parquet gnomad constraint metrics
      source: input/target/gnomad/gnomad_constraint_metrics.tsv.bgz
      destination: intermediate/target/gnomad/constraint_metrics.parquet
      separator: "\t"
      infer_schema: false

    - name: download ensembl
      source: input/target/ensembl/homo_sapiens.json
    - name: transform ensembl
      requires:
        - download ensembl
      transformer: ensembl
      source: input/target/ensembl/homo_sapiens.json
      destination: intermediate/target/ensembl/homo_sapiens.parquet

    - name: transform uniprot
      transformer: uniprot
      source: input/target/uniprot/uniprot.txt.gz
      destination: intermediate/target/uniprot/uniprot.parquet

    - name: transform chembl_target_class_dump
      transformer: chembl_target_class_dump
      source: input/chembl/chembl.tar.gz
      destination:
        target_dictionary: intermediate/chembl/target_dictionary.parquet
        target_components: intermediate/chembl/target_components.parquet
        component_sequences: intermediate/chembl/component_sequences.parquet
        component_class: intermediate/chembl/component_class.parquet
        protein_classification: intermediate/chembl/protein_classification.parquet
  ##################################################################################################

  #: TARGET STEP :##################################################################################
  target:
    - name: transform target
      transformer: target
      source:
        ensembl: input/ensembl/homo_sapiens
        chembl: input/chembl/chembl.tar.gz
        gene_ontology_human: input/target/go/goa_human.gaf.gz
        gene_ontology_rna: input/target/go/goa_human_rna.gaf.gz
        gene_ontology_rna_lookup: input/target/go/ensembl.tsv
        gene_ontology_eco_lookup: input/target/go/goa_human_eco.gpa.gz
        gnomad: input/target/gnomad/gnomad_constraint_metrics.tsv.bgz
        hallmarks: input/target/hallmarks/cosmic-hallmarks.tsv.gz
        hgnc: input/target/genenames/hgnc_complete_set.json
        hpa: input/target/hpa/subcellular_location.tsv.zip
        hpa_sl: input/target/hpa/subcellular_locations_ssl.tsv
        ncbi: input/target/ncbi/Homo_sapiens.gene_info.gz
        reactome_etl: output/reactome
        reactome_pathways: input/target/reactome/Ensembl2Reactome.txt
        uniprot: input/target/uniprot/uniprot.txt.gz
        uniprot_ssl: input/target/uniprot/uniprot-ssl.tsv.gz
      destination: output/target
  ##################################################################################################

  #: TRANSCRIPT STEP :#################################################################################
  transcript:
    - name: transform transcript
      transformer: transcript
      source:
        ensembl: input/ensembl/homo_sapiens
      destination: output/transcript
  ##################################################################################################

  #: TARGET_SAFETY_EVENT STEP :##########################################################################
  target_safety_event:
    - name: transform target_safety_event
      transformer: target_safety_event
      source:
        adverse_events: input/target/safety/adverse_effects.tsv
        safety_risks: input/target/safety/safety_risks.tsv
        brennan: input/target/safety/secondary_pharmacology.json
        toxcast: input/target/safety/toxcast.tsv
        aopwiki: input/target/safety/aopwiki.json
        pharmacogenetics: output/pharmacogenomics
        target: output/target
        diseases: output/disease
      destination: output/target_safety_event
  ##################################################################################################

  #: TARGET_TRACTABILITY STEP :#########################################################################
  target_tractability:
    - name: transform target_tractability
      transformer: target_tractability
      source:
        tractability: input/target/tractability/tractability.tsv
        target: output/target
      destination: output/target_tractability
  ##################################################################################################

  #: HOMOLOGY STEP :#####################################################################################
  homology:
    - name: transform homology
      transformer: homology
      source:
        species_dictionary: input/target/homologue/species_EnsemblVertebrates.txt
        homologies: input/target/homologue/homologies
        ensembl: input/ensembl
        target: output/target
      destination: output/homology
      settings:
        ensembl_species:
          - caenorhabditis_elegans
          - canis_lupus_familiaris
          - cavia_porcellus
          - danio_rerio
          - drosophila_melanogaster
          - macaca_mulatta
          - mus_musculus
          - oryctolagus_cuniculus
          - pan_troglodytes
          - rattus_norvegicus
          - sus_scrofa
          - xenopus_tropicalis
          - homo_sapiens
  ##################################################################################################

  #: TARGET_VIEW STEP :##################################################################################
  target_view:
    - name: pyspark target_view
      pyspark: target_view
      settings:
        partition_count: 3
      source:
        target: output/target
        homology: output/homology
        target_tractability: output/target_tractability
        target_safety_event: output/target_safety_event
        chemical_probes: output/chemical_probe
        transcript: output/transcript
      destination: view/target_view
  ##################################################################################################

  #: TARGET_GENE_ESSENTIALITY STEP :################################################################
  target_gene_essentiality:
    - name: transform gene_essentiality
      transformer: gene_essentiality
      source:
        models: input/target/gene-essentiality/depmap/Model.csv
        essential_genes: input/target/gene-essentiality/depmap/CRISPRInferredCommonEssentials.csv
        gene_effects: input/target/gene-essentiality/depmap/CRISPRGeneEffect.csv
        gene_expression: input/target/gene-essentiality/depmap/OmicsExpressionTPMLogp1HumanProteinCodingGenes.csv
        mutation_hotspots: input/target/gene-essentiality/depmap/OmicsSomaticMutationsMatrixHotspot.csv
        mutation_damaging: input/target/gene-essentiality/depmap/OmicsSomaticMutationsMatrixDamaging.csv
        depmap_tissue_mapping: input/ot_curation/mappings/biosystem/depmap_uberon_mapping.csv
        target: output/target
      destination: output/target_essentiality
      settings:
        keep_only_essentials: false
  ##################################################################################################

  #: PHARMACOGENETICS STEP :########################################################################
  pharmacogenetics:
    - name: pyspark pharmacogenetics
      pyspark: pharmacogenetics
      source:
        clinpgx: input/pharmacogenetics/clinpgx_annotation.json.gz
        phenotypes: input/pharmacogenetics/phenotypes.json
        ontoma_disease_label_lut: intermediate/ontoma/disease_label_lookup_table.parquet
        chembl_molecule: intermediate/chembl_molecule
        drug_mechanism_of_action: output/drug_mechanism_of_action
      destination:
        associations: output/pharmacogenomics
        unparsed_texts: intermediate/pharmacogenetics/unparsed_texts.json
      settings:
        partition_count: 1
  ##################################################################################################

  #: EVIDENCE_PROJECT_SCORE STEP :##################################################################
  evidence_project_score:
    - name: transform evidence.project_score
      transformer: evidence.project_score
      source:
        gene_scores: input/evidence/project_score/mapped_diseases.tsv
        cell_types: input/evidence/project_score/cell_types.tsv
        cell_passport: input/evidence/cell_passport.csv.gz
        cell_line_mapping: input/ot_curation/mappings/biosystem/depmap_uberon_mapping.csv
        target: output/target
        disease: output/disease
        literature: input/literature/literature_export
      destination:
        failed_evidence: excluded/evidence/crispr
        evidence: output/evidence_crispr
  ##################################################################################################

  #: EVIDENCE_GENE_BURDEN STEP :####################################################################
  evidence_gene_burden:
    - name: pyspark gene_burden
      pyspark: gene_burden
      source:
        az_binary: input/evidence/gene_burden/astrazeneca/azphewas-com-470k-phewas-binary
        az_quantitative: input/evidence/gene_burden/astrazeneca/azphewas-com-470k-phewas-quantitative
        az_genes: input/evidence/gene_burden/astrazeneca/azphewas_com_genes_UK_Biobank_470k.csv
        az_phenotypes: input/evidence/gene_burden/astrazeneca/azphewas_com_phenotypes_UK_Biobank_470k.csv
        finngen: input/evidence/gene_burden/finngen/finngen.txt.gz
        finngen_phenotypes: input/evidence/gene_burden/finngen/phenos
        genebass: input/evidence/gene_burden/genebass/**.parquet
        cvdi: input/evidence/gene_burden/cvdi.xlsx
        genes_and_health: input/evidence/gene_burden/genes_health.xlsx
        brava: input/evidence/gene_burden/brava.xlsx
        curated_studies: input/ot_curation/gene_burden/curated_evidence.tsv
        ontoma_disease_label_lut: intermediate/ontoma/disease_label_lookup_table.parquet
        ontoma_disease_id_lut: intermediate/ontoma/disease_id_lookup_table.parquet
      destination: intermediate/evidence/gene_burden.parquet
      settings:
        finngen_release: R12
  ##################################################################################################

  #: EVIDENCE_CLINICAL_PRECEDENCE STEP :############################################################
  evidence_clinical_precedence:
    - name: transform evidence.clinical_precedence
      transformer: evidence.clinical_precedence
      source:
        clinical_report: output/clinical_report
        drug_mechanism_of_action: output/drug_mechanism_of_action
        target: output/target
        disease: output/disease
        literature: input/literature/literature_export
      destination:
        failed_evidence: excluded/evidence/clinical_precedence
        evidence: output/evidence_clinical_precedence
        excluded_report: excluded/clinical_precedence_failed_report
      settings:
        invalid_clinical_report_qc:
          - PHASE_IV_NOT_APPROVED
          - INDIRECT_PRIMARY_PURPOSE
  ##################################################################################################

  #: EVIDENCE_CANCER_BIOMARKERS STEP :################################################################
  evidence_cancer_biomarkers:
    - name: transform evidence.cancer_biomarkers
      transformer: evidence.cancer_biomarkers
      source:
        associations: input/evidence/cancerbiomarkers/associations.tsv
        source: input/evidence/cancerbiomarkers/sources.jsonl
        biomarker_disease: input/evidence/cancerbiomarkers/diseases.jsonl
        drugs: output/drug_molecule
        target: output/target
        disease: output/disease
        literature: input/literature/literature_export
      destination:
        failed_evidence: excluded/evidence/cancer_biomarkers
        evidence: output/evidence_cancer_biomarkers
  ##################################################################################################

  #: EVIDENCE_ORPHANET STEP :#######################################################################
  evidence_orphanet:
    - name: pyspark orphanet
      pyspark: orphanet
      source:
        evidence: input/evidence/orphanet.xml
        ontoma_disease_label_lut: intermediate/ontoma/disease_label_lookup_table.parquet
        ontoma_disease_id_lut: intermediate/ontoma/disease_id_lookup_table.parquet
      destination: intermediate/evidence/orphanet.parquet
  ##################################################################################################

  #: EVIDENCE_CLINGEN STEP :#######################################################################
  evidence_clingen:
    - name: pyspark clingen
      pyspark: clingen
      source:
        evidence: input/evidence/clingen.csv
        ontoma_disease_label_lut: intermediate/ontoma/disease_label_lookup_table.parquet
        ontoma_disease_id_lut: intermediate/ontoma/disease_id_lookup_table.parquet
      destination: intermediate/evidence/clingen.parquet
  ##################################################################################################

  #: EVIDENCE_IMPC STEP :###########################################################################
  evidence_impc:
    - name: pyspark impc evidence strings
      pyspark: impc
      source:
        solr_gene_gene: input/impc/gene_gene.csv
        solr_ontology_ontology: input/impc/ontology_ontology.csv
        solr_mouse_model: input/impc/mouse_model.csv
        solr_disease: input/impc/disease.csv
        solr_disease_model_summary: input/impc/disease_model_summary.csv
        solr_ontology: input/impc/ontology.csv
        hgnc_gene_mappings: input/target/genenames/hgnc_complete_set.tsv
        mouse_gene_mappings: input/impc/MGI_Gene_Model_Coord.rpt
        mouse_pubmed_refs: input/impc/MGI_PhenoGenoMP.rpt
        mp_ontology: input/impc/mp.json
        ontoma_disease_label_lut: intermediate/ontoma/disease_label_lookup_table.parquet
        ontoma_disease_id_lut: intermediate/ontoma/disease_id_lookup_table.parquet
      destination: intermediate/evidence/impc.parquet
      settings:
        score_cutoff: 41
  ##################################################################################################

  #: EVIDENCE PANEL APP STEP :#######################################################################
  evidence_panel_app:
    - name: pyspark panel_app
      pyspark: panel_app
      source:
        evidence: input/evidence/panelapp/panel_app.tsv
        panels: input/evidence/panelapp/panels.jsonl
        ontoma_disease_label_lut: intermediate/ontoma/disease_label_lookup_table.parquet
        ontoma_disease_id_lut: intermediate/ontoma/disease_id_lookup_table.parquet
      destination: intermediate/evidence/panel_app.parquet
  ##################################################################################################

  #: EVIDENCE_CRISPR_SCREENS STEP :#################################################################
  evidence_crispr_screens:
    - name: transform evidence.crispr_screens
      transformer: evidence.crispr_screens
      source:
        screens: input/evidence/crispr_screens/brain_screens.json.gz
        studies_dir: input/evidence/crispr_screens/brain_studies
        disease_mapping: input/ot_curation/mappings/disease/brain_crispr_studies.tsv
        target: output/target
        disease: output/disease
        literature: input/literature/literature_export
      destination:
        failed_evidence: excluded/evidence/crispr_screen
        evidence: output/evidence_crispr_screen
  ##################################################################################################

  #: EVIDENCE_GENE2PHENOTYPE STEP :#################################################################
  evidence_gene2phenotype:
    - name: pyspark gene2phenotype
      pyspark: gene2phenotype
      source:
        cancer_panel: input/evidence/gene2phenotype/cancer.csv
        cardiac_panel: input/evidence/gene2phenotype/cardiac.csv
        developmental_panel: input/evidence/gene2phenotype/dd.csv
        ear_panel: input/evidence/gene2phenotype/ear.csv
        eye_panel: input/evidence/gene2phenotype/eye.csv
        skeletal_panel: input/evidence/gene2phenotype/skeletal.csv
        skin_panel: input/evidence/gene2phenotype/skin.csv
        ontoma_disease_label_lut: intermediate/ontoma/disease_label_lookup_table.parquet
        ontoma_disease_id_lut: intermediate/ontoma/disease_id_lookup_table.parquet
      destination: intermediate/evidence/gene2phenotype.parquet
  ##################################################################################################

  #: EVIDENCE_INTOGEN STEP :#######################################################################
  evidence_intogen:
    - name: transform evidence.intogen
      transformer: evidence.intogen
      source:
        genes: input/evidence/intogen/Compendium_Cancer_Genes.tsv
        cohorts: input/evidence/intogen/cohorts.tsv
        disease_mapping: input/ot_curation/mappings/disease/cancer2EFO_mappings.tsv
        target: output/target
        disease: output/disease
        literature: input/literature/literature_export
      destination:
        failed_evidence: excluded/evidence/intogen
        evidence: output/evidence_intogen
  ##################################################################################################

  #: EVIDENCE PPP STEP :############################################################################
  evidence_ot_crispr:
    - name: transform evidence.ot_crispr
      transformer: evidence.ot_crispr
      source:
        study_table: input/evidence/ot_crispr/config.csv
        ot_crispr_data: input/evidence/ot_crispr/data
        target: output/target
        disease: output/disease
      destination:
        failed_evidence: excluded/evidence/ot_crispr
        evidence: output/evidence_ot_crispr
  ##################################################################################################

  #: ONTOMA STEPS :##################################################################################
  ontoma:
    - name: pyspark ontoma generate lookup tables
      pyspark: ontoma_lut_generation
      source:
        disease_index: output/disease
        ot_disease_curation: input/ontoma/ot_disease_curation.tsv
        eva_clinvar: input/ontoma/eva_clinvar.txt
        clinvar_xrefs: input/ontoma/clinvar_xrefs.txt
      destination:
        disease_label_lut: intermediate/ontoma/disease_label_lookup_table.parquet
        disease_id_lut: intermediate/ontoma/disease_id_lookup_table.parquet

  # This is split so that we don't run into circularity issues
  # pts_ontoma currently lists pts_target as a dependency, while pts_target indirectly depends back
  # on pts_ontoma through pts_target_safety_event → pts_pharmacogenetics.
  literature_ontoma:
    - name: pyspark literature ontoma lut generation
      pyspark: literature_ontoma_lut_generation
      source:
        disease_index: output/disease
        ot_disease_curation: input/ontoma/ot_disease_curation.tsv
        eva_clinvar: input/ontoma/eva_clinvar.txt
        clinvar_xrefs: input/ontoma/clinvar_xrefs.txt
        target_index: output/target
        drug_index: output/drug_molecule
      destination:
        disease_target_drug_label_lut: intermediate/ontoma/disease_target_drug_label_lookup_table.parquet
  ##################################################################################################

  #: DRUG_WARNING STEP :############################################################################
  drug_warning:
    - name: transform drug_warning
      transformer: drug_warning
      source: input/chembl/chembl.tar.gz
      destination: output/drug_warning
  ##################################################################################################

  #: DRUG_MECHANISM_OF_ACTION STEP :###############################################################
  drug_mechanism_of_action:
    - name: transform drug_mechanism_of_action
      transformer: drug_mechanism_of_action
      source:
        chembl: input/chembl/chembl.tar.gz
        target: output/target
      destination: output/drug_mechanism_of_action
  ##################################################################################################

  #: CHEMBL_MOLECULE STEP :#########################################################################
  chembl_molecule:
    - name: transform chembl_molecule
      transformer: chembl_molecule
      source:
        chembl: input/chembl/chembl.tar.gz
        drugbank: input/drug/drugbank.csv.gz
        aact_trial_extraction: input/clinical_report/aact_trial_extraction
      destination: intermediate/chembl_molecule
  ##################################################################################################

  #: DRUG_MOLECULE STEP :##########################################################################
  drug_molecule:
    - name: transform drug_molecule
      transformer: drug_molecule
      source:
        molecule: intermediate/chembl_molecule
        chemical_probes: output/chemical_probe
        mechanism_of_action: output/drug_mechanism_of_action
        clinical_report: output/clinical_report
        disease: output/disease
      destination:
        output: output/drug_molecule
        excluded: excluded/drug_molecule_failed_report
  ##################################################################################################

  #: AACT_TRIAL_EXTRACTION STEP :##################################################################
  # Not part of a release. The `aact_trial_extraction` DAG runs this step with
  # release_uri pointed at gs://aact_data/${aact_version}, so every path below
  # resolves inside that snapshot, except for the cache
  aact_trial_extraction:
    - name: llm_extract aact trials
      source:
        aact: input/aact.zip
      destination:
        prompts: prompts/prompts.parquet
        extraction: extraction/extractions.parquet
        errors: errors/errors.jsonl
      cache_uri: gs://aact_data/cache/trial_extraction
      # the AACT version, so a rerun against the same archive resumes from the
      # shards the last attempt finished instead of paying for them again
      snapshot: '{{snapshot}}'
      model: gpt-5-nano-2025-08-07
      service_tier: auto
      concurrency: 75
      shard_size: 200
      publications:
        # see PublicationsSpec — this fetches abstracts for every trial, not
        # only cache misses, so it needs its own cache before a full run
        enabled: false
  ##################################################################################################

  #: CLINICAL_REPORT STEP :#######################################################################
  clinical_report:
    - name: pyspark clinical_report
      source:
        chembl_molecule: intermediate/chembl_molecule
        disease: output/disease
        pmda: input/clinical_report/pmda.pdf
        ttd: input/clinical_report/ttd.txt
        ema: input/clinical_report/ema_medicines.xlsx
        chembl: input/chembl/chembl.tar.gz
        aact: input/clinical_report/aact.zip
        chembl_curation: input/clinical_report/chembl_mapping.parquet
        trial_extraction: input/clinical_report/aact_trial_extraction
        ner_cache_path: input/clinical_report/ner_cache.parquet
        models: input/clinical_report/models
      destination:
        output: output/clinical_report
      settings:
        ner_batch_size: 256
      pyspark: clinical_report
  ##################################################################################################

  #: CLINICAL_INDICATION STEP :####################################################################
  clinical_indication:
    - name: transform clinical_indication
      source: output/clinical_report
      destination:
        output: output/clinical_indication
        excluded: excluded/clinical_indication_failed_report
      transformer: clinical_indication
      settings:
        invalid_clinical_report_qc:
          - PHASE_IV_NOT_APPROVED
          - INDIRECT_PRIMARY_PURPOSE
  ##################################################################################################

  #: CLINICAL_TARGET STEP :#########################################################################
  clinical_target:
    - name: transform clinical_target
      source:
        clinical_report: output/clinical_report
        drug_mechanism_of_action: output/drug_mechanism_of_action
      destination:
        output: output/clinical_target
        excluded: excluded/clinical_target_failed_report
      transformer: clinical_target
      settings:
        invalid_clinical_report_qc:
          - PHASE_IV_NOT_APPROVED
          - INDIRECT_PRIMARY_PURPOSE
  ##################################################################################################

  #: TARGET_PRIORITISATION STEP :###################################################################
  target_prioritisation:
    - name: transform target_prioritisation
      transformer: target_prioritisation
      source:
        targets: output/target
        tractability: output/target_tractability
        target_safety_event: output/target_safety_event
        chemical_probes: output/chemical_probe
        homology: output/homology
        mouse_phenotypes: output/mouse_phenotype
        molecule: output/drug_molecule
        mechanism_of_action: output/drug_mechanism_of_action
        baseline_expression: output/baseline_expression
        uniprot_slterms: input/target_prioritisation/uniprot_locations.tsv.gz
        mouse_pheno_scores: input/target_prioritisation/mouse_pheno_scores.csv
      destination: output/target_prioritisation
  ##################################################################################################

  #: ASSOCIATION STEP :#############################################################################
  association:
    - name: pyspark association
      pyspark: association
      source:
        evidence: output/evidence_*
        disease: output/disease
      destination:
        overall_direct: output/association_overall_direct
        overall_indirect: output/association_overall_indirect
        by_datasource_direct: output/association_by_datasource_direct
        by_datasource_indirect: output/association_by_datasource_indirect
        by_datatype_direct: output/association_by_datatype_direct
        by_datatype_indirect: output/association_by_datatype_indirect
        temporary: intermediate/indirect_association_intermediate
      properties:
        spark.driver.memory: '12g'
      settings:
        partition_count:
          overall_direct: 14
          overall_indirect: 39
          by_datasource_direct: 14
          by_datasource_indirect: 43
          by_datatype_direct: 15
          by_datatype_indirect: 41
        novelty_scale: 2 # 2 for long tailed slow decays
        novelty_shift: 3 # 3 for long tailed slow decays
        novelty_window: 10
        datasource_weights:
          - datasourceId: cancer_biomarkers
            weight: 0.5
            datatypeId: affected_pathway
            toPropagate: true
          - datasourceId: cancer_gene_census
            weight: 1.0
            datatypeId: somatic_mutation
            toPropagate: true
          - datasourceId: clingen
            weight: 1.0
            datatypeId: genetic_literature
            toPropagate: true
          - datasourceId: clinical_precedence
            weight: 1.0
            datatypeId: known_drug
            toPropagate: true
          - datasourceId: crispr
            weight: 1.0
            datatypeId: affected_pathway
            toPropagate: true
          - datasourceId: crispr_screen
            weight: 1.0
            datatypeId: affected_pathway
            toPropagate: true
          - datasourceId: encore
            weight: 0.5
            datatypeId: ot_partner
            toPropagate: true
          - datasourceId: europepmc
            weight: 0.2
            datatypeId: literature
            toPropagate: true
          - datasourceId: eva
            weight: 1.0
            datatypeId: genetic_association
            toPropagate: true
          - datasourceId: eva_somatic
            weight: 1.0
            datatypeId: somatic_mutation
            toPropagate: true
          - datasourceId: expression_atlas
            weight: 0.2
            datatypeId: rna_expression
            toPropagate: false
          - datasourceId: gene2phenotype
            weight: 1.0
            datatypeId: genetic_literature
            toPropagate: true
          - datasourceId: gene_burden
            weight: 1.0
            datatypeId: genetic_association
            toPropagate: true
          - datasourceId: genomics_england
            weight: 1.0
            datatypeId: genetic_literature
            toPropagate: true
          - datasourceId: gwas_credible_sets
            weight: 1.0
            datatypeId: genetic_association
            toPropagate: true
          - datasourceId: impc
            weight: 0.2
            datatypeId: animal_model
            toPropagate: true
          - datasourceId: intogen
            weight: 1.0
            datatypeId: somatic_mutation
            toPropagate: true
          - datasourceId: orphanet
            weight: 1.0
            datatypeId: genetic_association
            toPropagate: true
          - datasourceId: ot_crispr
            weight: 0.5
            datatypeId: ot_partner
            toPropagate: true
          - datasourceId: ot_crispr_validation
            weight: 0.5
            datatypeId: ot_validation_lab
            toPropagate: true
          - datasourceId: reactome
            weight: 1.0
            datatypeId: affected_pathway
            toPropagate: true
          - datasourceId: uniprot_literature
            weight: 1.0
            datatypeId: genetic_literature
            toPropagate: true
          - datasourceId: uniprot_variants
            weight: 1.0
            datatypeId: genetic_association
            toPropagate: true
  ##################################################################################################

  #: EVIDENCE POST PROCESS STEP :###################################################################
  evidence_expression_atlas:
    - name: transform evidence.expression_atlas
      transformer: evidence.expression_atlas
      source:
        evidence: input/evidence/atlas.parquet
        target: output/target
        disease: output/disease
        literature: input/literature/literature_export
      destination:
        failed_evidence: excluded/evidence/expression_atlas
        evidence: output/evidence_expression_atlas

  evidence_clinvar:
    - name: transform evidence.clinvar
      transformer: evidence.clinvar
      source:
        evidence: input/evidence/eva.json.gz
        target: output/target
        disease: output/disease
        literature: input/literature/literature_export
      destination:
        failed_evidence: excluded/evidence/eva
        evidence: output/evidence_eva

  evidence_clinvar_somatic:
    - name: transform evidence.clinvar_somatic
      transformer: evidence.clinvar_somatic
      source:
        evidence: input/evidence/eva.json.gz
        target: output/target
        disease: output/disease
        literature: input/literature/literature_export
      destination:
        failed_evidence: excluded/evidence/eva_somatic
        evidence: output/evidence_eva_somatic

  evidence_uniprot_variants:
    - name: transform evidence.uniprot_variants
      transformer: evidence.uniprot_variants
      source:
        evidence: input/evidence/uniprot_variants.json.gz
        target: output/target
        disease: output/disease
        literature: input/literature/literature_export
      destination:
        failed_evidence: excluded/evidence/uniprot_variants
        evidence: output/evidence_uniprot_variants

  evidence_uniprot_literature:
    - name: transform evidence.uniprot_literature
      transformer: evidence.uniprot_literature
      source:
        evidence: input/evidence/uniprot_literature.json.gz
        target: output/target
        disease: output/disease
        literature: input/literature/literature_export
      destination:
        failed_evidence: excluded/evidence/uniprot_literature
        evidence: output/evidence_uniprot_literature

  evidence_postprocess_clingen:
    - name: pyspark evidence_postprocess
      pyspark: evidence_postprocess
      source:
        evidence_path: intermediate/evidence/clingen.parquet
        target_path: output/target
        disease_path: output/disease
        publication_date_lut: input/literature/literature_export
      destination:
        failed_evidence: excluded/evidence/clingen
        evidence: output/evidence_clingen
      settings:
        partition_count: 1
        datasource_id: clingen
        evidence_format: parquet
        score_expression: |
          element_at(
            map(
              'No Known Disease Relationship', 0.01,
              'Refuted', 0.01,
              'Disputed', 0.01,
              'Limited', 0.01,
              'Moderate', 0.5,
              'Strong', 1.0,
              'Definitive', 1.0
            ),
            confidence
          )
        unique_fields:
          - targetId
          - targetFromSourceId
          - diseaseId
          - datasourceId
          - diseaseFromSource
          - studyId
          - allelicRequirements

  evidence_reactome:
    - name: transform evidence.reactome
      transformer: evidence.reactome
      source:
        evidence: input/evidence/reactome.json.gz
        target: output/target
        disease: output/disease
        literature: input/literature/literature_export
      destination:
        failed_evidence: excluded/evidence/reactome
        evidence: output/evidence_reactome

  evidence_postprocess_impc:
    - name: pyspark evidence_postprocess
      pyspark: evidence_postprocess
      source:
        evidence_path: intermediate/evidence/impc.parquet
        target_path: output/target
        disease_path: output/disease
        publication_date_lut: input/literature/literature_export
      destination:
        failed_evidence: excluded/evidence/impc
        evidence: output/evidence_impc
      settings:
        partition_count: 25
        evidence_format: parquet
        datasource_id: impc
        score_expression: resourceScore / 100
        unique_fields:
          - targetId
          - targetFromSourceId
          - diseaseId
          - datasourceId
          - biologicalModelGeneticBackground
          - targetInModel
          - biologicalModelAllelicComposition
          - diseaseFromSource
        direction_on_trait_expression: CASE WHEN diseaseId IS NOT NULL THEN 'risk' END
        direction_on_target_expression: CASE WHEN diseaseId IS NOT NULL THEN 'LoF' END

  evidence_postprocess_orphanet:
    - name: pyspark evidence_postprocess
      pyspark: evidence_postprocess
      source:
        evidence_path: intermediate/evidence/orphanet.parquet
        target_path: output/target
        disease_path: output/disease
        publication_date_lut: input/literature/literature_export
      destination:
        failed_evidence: excluded/evidence/orphanet
        evidence: output/evidence_orphanet
      settings:
        partition_count: 1
        evidence_format: parquet
        datasource_id: orphanet
        score_expression: element_at(map('Assessed', 1.0, 'Not yet assessed', 0.5), confidence)
        unique_fields:
          - targetId
          - targetFromSourceId
          - diseaseId
          - datasourceId
          - diseaseFromSourceId
        direction_on_trait_expression: CASE WHEN diseaseId IS NOT NULL THEN 'risk' END
        direction_on_target_expression: |
          CASE
            WHEN variantFunctionalConsequenceId == 'SO_0002053' THEN 'GoF'
            WHEN variantFunctionalConsequenceId == 'SO_0002054' THEN 'LoF'
            ELSE null
          END

  evidence_postprocess_gene2phenotype:
    - name: pyspark evidence_postprocess
      pyspark: evidence_postprocess
      source:
        evidence_path: intermediate/evidence/gene2phenotype.parquet
        target_path: output/target
        disease_path: output/disease
        publication_date_lut: input/literature/literature_export
      destination:
        failed_evidence: excluded/evidence/gene2phenotype
        evidence: output/evidence_gene2phenotype
      settings:
        partition_count: 1
        evidence_format: parquet
        datasource_id: gene2phenotype
        score_expression: |
          element_at(
            map(
              'definitive', 1.0,
              'both RD and IF', 1.0,
              'strong', 1.0,
              'moderate', 0.5,
              'limited', 0.01
            ),
            confidence
          )
        unique_fields:
          - targetId
          - targetFromSourceId
          - diseaseId
          - datasourceId
          - diseaseFromSource
          - allelicRequirements
          - studyId
        direction_on_trait_expression: CASE WHEN diseaseId IS NOT NULL THEN 'risk' END
        direction_on_target_expression: |
          CASE
            WHEN variantFunctionalConsequenceId == 'SO_0002315' THEN 'GoF'
            WHEN variantFunctionalConsequenceId == 'SO_0002317' THEN 'LoF'
            ELSE null
          END

  evidence_postprocess_gene_burden:
    - name: pyspark evidence_postprocess
      pyspark: evidence_postprocess
      source:
        evidence_path: intermediate/evidence/gene_burden.parquet
        target_path: output/target
        disease_path: output/disease
        publication_date_lut: input/literature/literature_export
      destination:
        failed_evidence: excluded/evidence/gene_burden
        evidence: output/evidence_gene_burden
      settings:
        partition_count: 1
        evidence_format: parquet
        datasource_id: gene_burden
        score_expression: >-
          CASE
            WHEN resourceScore IS NULL OR isnan(resourceScore) THEN NULL
            WHEN resourceScore <= 0 THEN 1.0
            ELSE LEAST(1.0, GREATEST(0.25,
              (1.0 - 0.25) * (log10(resourceScore) - log10(1e-7)) / (log10(1e-17) - log10(1e-7)) + 0.25
            ))
          END
        unique_fields:
          - targetId
          - targetFromSourceId
          - diseaseId
          - datasourceId
          - ancestryId
          - diseaseFromSource
          - statisticalMethod
          - projectId
        direction_on_trait_expression: |
          CASE WHEN oddsRatio > 1.0 THEN 'risk'
          WHEN oddsRatio < 1.0 THEN 'protect'
          WHEN beta > 0.0 THEN 'risk'
          WHEN beta < 0.0 THEN 'protect'
          END
        direction_on_target_expression: |
          'LoF'

  evidence_europepmc:
    - name: transform evidence.europepmc
      transformer: evidence.europepmc
      source:
        cooccurrence: intermediate/literature/cooccurrence
        target: output/target
        disease: output/disease
        literature: input/literature/literature_export
      destination:
        failed_evidence: excluded/evidence/europepmc
        evidence: output/evidence_europepmc

  evidence_postprocess_panel_app:
    - name: pyspark evidence_postprocess
      pyspark: evidence_postprocess
      source:
        evidence_path: intermediate/evidence/panel_app.parquet
        target_path: output/target
        disease_path: output/disease
        publication_date_lut: input/literature/literature_export
      destination:
        failed_evidence: excluded/evidence/panel_app
        evidence: output/evidence_genomics_england
      settings:
        partition_count: 1
        evidence_format: parquet
        datasource_id: genomics_england
        score_expression: |
          element_at(
            map(
              'amber', 0.5,
              'green', 1.0
            ),
            confidence
          )
        unique_fields:
          - targetId
          - targetFromSourceId
          - diseaseId
          - datasourceId
          - diseaseFromSource
          - studyId

  evidence_cosmic:
    - name: transform evidence.cosmic
      transformer: evidence.cosmic
      source:
        evidence: input/evidence/cosmic.json.gz
        target: output/target
        disease: output/disease
        literature: input/literature/literature_export
      destination:
        failed_evidence: excluded/evidence/cancer_gene_census
        evidence: output/evidence_cancer_gene_census

  evidence_encore:
    - name: transform evidence.encore
      transformer: evidence.encore
      source:
        evidence: input/evidence/encore
        target: output/target
        disease: output/disease
      destination:
        failed_evidence: excluded/evidence/encore
        evidence: output/evidence_encore

  evidence_validation_lab:
    - name: transform evidence.validation_lab
      transformer: evidence.validation_lab
      source:
        evidence: input/evidence/validation_lab.json.gz
        target: output/target
        disease: output/disease
      destination:
        failed_evidence: excluded/evidence/ot_crispr_validation
        evidence: output/evidence_ot_crispr_validation
  ##################################################################################################

  #: ASSOCIATION_OTF STEP :#########################################################################
  association_otf:
    - name: pyspark association_otf
      pyspark: association_otf
      properties:
        spark.driver.memory: '20g'
      source:
        disease: output/disease
        evidence: output/evidence_*
        target: output/target
        tractability: output/target_tractability
        association_direct: output/association_overall_direct
        association_indirect: output/association_overall_indirect
      destination: view/association_otf
  ##################################################################################################

  #: L2G STEP :#####################################################################################
  l2g:
    - name: transform l2g_train
      transformer: l2g_train
      source:
        feature_matrix: intermediate/l2g_feature_matrix
        credible_set: output/credible_set
        gold_standard: input/l2g/gold_standard.json
        predefined_test: input/l2g/predefined_test_for_split
      destination:
        model: etc/model/locus_to_gene_model/classifier.skops
        background: etc/model/locus_to_gene_model/shap_background.parquet
        metrics: etc/model/locus_to_gene_model/metrics.json
        train_split: intermediate/l2g_train_split
        test_split: intermediate/l2g_test_split
        split_stats: intermediate/l2g_train_test_split_stats.json
      settings:
        # fitted order; also the order of the output `features` array
        features_list: &l2g_features
          - eQtlColocClppMaximum
          - pQtlColocClppMaximum
          - sQtlColocClppMaximum
          - eQtlColocH4Maximum
          - pQtlColocH4Maximum
          - sQtlColocH4Maximum
          - eQtlColocClppMaximumNeighbourhood
          - pQtlColocClppMaximumNeighbourhood
          - sQtlColocClppMaximumNeighbourhood
          - eQtlColocH4MaximumNeighbourhood
          - pQtlColocH4MaximumNeighbourhood
          - sQtlColocH4MaximumNeighbourhood
          - distanceSentinelFootprint
          - distanceSentinelFootprintNeighbourhood
          - distanceFootprintMean
          - distanceFootprintMeanNeighbourhood
          - distanceTssMean
          - distanceTssMeanNeighbourhood
          - distanceSentinelTss
          - distanceSentinelTssNeighbourhood
          - vepMaximum
          - vepMaximumNeighbourhood
          - vepMean
          - vepMeanNeighbourhood
          - e2gMean
          - e2gMeanNeighbourhood
          - geneCount500kb
          - proteinGeneCount500kb
          - credibleSetConfidence
          - transPQtlColocH4Maximum
          - transPQtlColocH4MaximumNeighbourhood
        # Pinned in #123.
        hyperparameters:
          objective: binary:logistic
          eval_metric: aucpr
          random_state: 777
          n_estimators: 200
          max_depth: 4
          min_child_weight: 10
          eta: 0.025
          subsample: 0.8
          colsample_bytree: 0.8
          reg_alpha: 1
          reg_lambda: 1.0
          scale_pos_weight: 0.8
          gamma: 0
          max_delta_step: 1
        train_on_full_dataset: true
        shap_background_size: 100
        shap_background_seed: 42
    - name: transform l2g_predict
      requires:
        - transform l2g_train
      transformer: l2g_predict
      source:
        feature_matrix: intermediate/l2g_feature_matrix
        credible_set: output/credible_set
        model: etc/model/locus_to_gene_model/classifier.skops
        background: etc/model/locus_to_gene_model/shap_background.parquet
      destination: output/l2g_prediction
      settings:
        features_list: *l2g_features
        l2g_threshold: &l2g_threshold 0.05
        explain_predictions: true
        # shap_background_size is set on l2g_train only

  #: EVIDENCE_GWAS_CREDIBLE_SETS STEP :#############################################################
  evidence_gwas_credible_sets:
    - name: transform evidence.gwas_credible_sets
      transformer: evidence.gwas_credible_sets
      source:
        l2g_predictions: output/l2g_prediction
        credible_set: output/credible_set
        study_index: output/study
        target: output/target
        disease: output/disease
        literature: input/literature/literature_export
      destination:
        failed_evidence: excluded/evidence/gwas_credible_sets
        evidence: output/evidence_gwas_credible_sets
      settings:
        locus_to_gene_threshold: *l2g_threshold

  #: VEP_VIEW STEP :################################################################################
  vep_view:
    - name: transform vep view
      transformer: vep_view
      source:
        credible_set: output/credible_set
        study_table: output/study
        l2g_table: output/l2g_prediction
        biosample: output/biosample
      destination:
        vep_data_header: intermediate/vep_view/vep_view_header.tsv
        vep_data_all: intermediate/vep_view/vep_view
        vep_data_gwas: intermediate/vep_view/vep_view_gwas
        vep_data_qtl: intermediate/vep_view/vep_view_qtl
  ##################################################################################################

  #: ASSOCIATION_TIMESERIES_VIEW STEP :#############################################################
  association_timeseries_view:
    - name: pyspark timeseries view
      pyspark: association_timeseries_view
      source:
        association_overall_direct: output/association_overall_direct
        association_overall_indirect: output/association_overall_indirect
        association_by_datasource_direct: output/association_by_datasource_direct
        association_by_datasource_indirect: output/association_by_datasource_indirect
      destination: view/association_timeseries
      properties:
        spark.driver.memory: 12g
  ##################################################################################################

  #: SEARCH_FACET STEP :############################################################################
  search_facet:
    - name: transform search_facet
      transformer: search_facet
      source:
        diseases: output/disease
        targets: output/target
        go: output/go
        reactome: output/reactome
        tractability: output/target_tractability
      destination:
        targets: view/search_facet_target
        diseases: view/search_facet_disease
  ##################################################################################################

  #: INTERACTION STEP :#############################################################################
  interaction:
    - name: transform interaction
      transformer: interaction
      source:
        targets: output/target
        rnacentral: input/interaction/rna_central_ensembl.tsv
        humanmapping: input/interaction/HUMAN_9606_idmapping.dat.gz
        ensproteins: input/interaction/Homo_sapiens.GRCh38.chr.gtf.gz
        intact: input/interaction/intact-interactors.json
        strings: input/interaction/string-interactions.txt.gz
      destination:
        interactions: output/interaction
        interactions_evidence: output/interaction_evidence
        interactions_unmatched: excluded/interaction
      settings:
        scorethreshold: 0
        string_version: ${string_version}
  ##################################################################################################

  #: RELEASE_METRICS STEP :#########################################################################
  release_metrics:
    - name: transform release_metrics
      transformer: release_metrics
      source: {}
      destination:
        parquet: metrics.parquet
      settings:
        ot_release: '{{release_name}}'
        metric_scopes:
          - /output/*/
          - /excluded/evidence/*/
        rich_dataset_whitelist:
          - /output/evidence_*
          - /excluded/evidence/*
          - /output/association_by_datasource_direct
          - /output/association_by_datasource_indirect
          - /output/disease
          - /output/target
          - /output/drug_molecule
          - /output/study
          - /output/clinical_report
  ##################################################################################################

  #: SEARCH STEP :##################################################################################
  search:
    - name: transform search
      transformer: search
      source:
        association: output/association_overall_indirect
        drug: output/drug_molecule
        evidence: output/evidence_*
        indication: output/clinical_indication
        mechanism: output/drug_mechanism_of_action
        target: output/target
        credible_sets: output/credible_set
        disease: output/disease
        disease_hpo: output/disease_phenotype
        hpo: output/disease_hpo
        studies: output/study
        variants: output/variant
      destination:
        diseases: view/search_disease
        targets: view/search_target
        drugs: view/search_drug
        variants: view/search_variant
        studies: view/search_study
  ##################################################################################################

  #: SEARCH_EBI STEP :##############################################################################
  search_ebi:
    - name: transform search_ebi
      transformer: search_ebi
      source:
        disease: output/disease
        target: output/target
        association: output/association_overall_direct
        evidence: output/evidence_gwas_credible_sets
      destination:
        associations: view/search_ebi_associations
        evidence: view/search_ebi_evidence
  ##################################################################################################

  #: LITERATURE STEPS (run on pts_literature cluster) :#############################################
  literature_publication_match:
    - name: pyspark literature publication match
      pyspark: literature_publication_match
      source:
        pub_id_lut: input/literature/PMID_PMCID_DOI.csv.gz
        epmc_publication: gs://otar025-epmc/ml02
        ontoma_disease_target_drug_label_lut: intermediate/ontoma/disease_target_drug_label_lookup_table.parquet
      destination:
        match_valid: intermediate/literature/match
        match_failed: excluded/literature/match
      settings:
        date_prefix: ''
        repartition: 25000
        match_valid_coalesce: 600
        match_failed_coalesce: 530
      properties:
        # Per-step overrides for the heavy publication_match step. Held-executor
        # pin (dynamicAllocation.*) survives the autoscaler downscale issue
        # observed in PTS run-015. AQE coalesce + skew handling and the EPMC
        # file partition cap (32MB) were validated on runs 013-016.
        'spark.sql.shuffle.partitions': '15000'
        'spark.sql.adaptive.skewJoin.skewedPartitionFactor': '2'
        'spark.sql.adaptive.skewJoin.skewedPartitionThresholdInBytes': '64MB'
        'spark.sql.adaptive.advisoryPartitionSizeInBytes': '268435456'
        'spark.sql.adaptive.coalescePartitions.parallelismFirst': 'false'
        'spark.sql.files.maxPartitionBytes': '33554432'
        'spark.dynamicAllocation.executorIdleTimeout': '7200s'
        'spark.dynamicAllocation.shuffleTracking.enabled': 'true'
        'spark.dynamicAllocation.shuffleTracking.timeout': '7200s'

  literature_entity_lut:
    - name: pyspark literature entity lut
      pyspark: literature_entity_lut
      source:
        matches: intermediate/literature/match
      destination:
        literature_entity_lut: output/literature_entity_lut
      settings:
        partition_count: 35
      properties:
        'spark.sql.shuffle.partitions': '10000'

  literature_embedding:
    - name: pyspark literature embedding
      pyspark: literature_embedding
      source:
        matches: intermediate/literature/match
      destination:
        model: etc/model/w2v_model
      properties:
        'spark.sql.shuffle.partitions': '15000'

  literature_vector:
    - name: pyspark literature vector
      pyspark: literature_vector
      source:
        model: etc/model/w2v_model
      destination:
        vectors: output/literature_vector

  literature_cooccurrence:
    - name: pyspark literature cooccurrence
      pyspark: literature_cooccurrence
      source:
        match: intermediate/literature/match
      destination:
        cooccurrence: intermediate/literature/cooccurrence
      settings:
        cooccurrence_coalesce: 40
      properties:
        'spark.sql.shuffle.partitions': '15000'
        'spark.sql.adaptive.skewJoin.skewedPartitionFactor': '2'
        'spark.sql.adaptive.skewJoin.skewedPartitionThresholdInBytes': '64MB'
  ##################################################################################################
