[project]
name = "PTS"
version = "26.12.0rc25"
description = "Open Targets Pipeline Transformation Stage"
authors = [{ name = "Open Targets Core Team", email = "devs@opentargets.net" }]
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }

dependencies = [
  "loguru>=0.7.3",
  "opentargets-otter>=26.9.1",
  "pandas>=3.0.6",
  "pyarrow>=22.0.0",
  "polars[connectorx]>=1.41.2",
  "pyspark>=4.1,<4.2",
  "spark-nlp==7.0.0",
  "pydantic>=2.13.4",
  "openpyxl>=3.1.5",
  "numpy>=2.4.4",
  "obonet>=1.3.0",
  "polars-hash>=0.5.6",
  "pdfplumber>=0.11.9",
  "pixeltable-pgserver>=0.6,<0.7",
  "opentargets-mira>=1.0.5",
  "networkx>=3.6.1",
  # spark-nlp imports distutils, which Python 3.12 only has through setuptools
  "setuptools>=80",
]

[dependency-groups]
dev = ["ruff==0.16.10", "ty==0.0.85"]
test = ["pytest>=9.0.3", "pytest-mock>=3.15.1", "pytest-split>=0.11.0", "statsmodels>=0.15.0"]

[project.optional-dependencies]
baseline_expression = ["scanpy>=1.10.0", "cellex", "gcsfs>=2026.2.0"]
# driver-only: pts clusters install it on the master alone
nlp = ["huggingface-hub>=2.0.0", "opentargets-mira[ner]>=1.0.5", "torch>=2.10.0", "transformers>=5.0.0"]
# image-only: pts clusters do not install it
# xgboost-cpu has no macos wheels
l2g = [
  "xgboost-cpu>=3.2.0; sys_platform == 'linux'",
  "xgboost>=3.2.0; sys_platform != 'linux'",
  "shap>=0.51.0",
  "scikit-learn>=1.7.0",
  "skops>=0.11.0",
]

[tool.uv]
# moved together with the polars major by Renovate (#146)
constraint-dependencies = ["polars<3"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
cellex = { git = "https://github.com/perslab/CELLEX", rev = "119c7ca" }

[project.scripts]
pts = "pts.core:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: mark a test as slow (deselect with '-m \"not slow\"')",
  "pgserver: starts a real postgres server (deselect with '-m \"not pgserver\"')",
]

[tool.ruff]
extend = "../ruff.toml"

# Fix spark functions being flagged as missing arguments
# https://github.com/astral-sh/ty/issues/2759
[[tool.ty.overrides]]
include = ["src/pts/pyspark/**/*.py", "tests/**/*.py"]
[tool.ty.overrides.rules]
missing-argument = "ignore"
invalid-argument-type = "ignore"
