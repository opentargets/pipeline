[project]
name = "PTS"
version = "26.9.1rc7"
description = "Open Targets Pipeline Transformation Stage"
authors = [{ name = "Open Targets Core Team", email = "devs@opentargets.net" }]
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }

dependencies = [
  "loguru>=0.7.3",
  "opentargets-otter>=26.9.1",
  "pandas>=3.0.6",
  "polars[connectorx]>=1.41.2,<3",
  # pts clusters run Spark 4.1 (Dataproc image 3.0) and load the staged Scala 2.13 spark-nlp jar
  # (`spark_nlp_version` in orchestration's unified_pipeline.yaml).
  "pyspark>=4.1,<4.2",
  "spark-nlp==7.0.0",
  "openai>=2.41.1",
  "openpyxl>=3.1.5",
  "numpy>=2.4.4",
  "obonet>=1.3.0",
  "polars-hash>=0.5.6",
  "torch>=2.10.0",
  "ontoma>=2.7.1",
  "transformers>=5.0.0,<6.0.0",
  "gcsfs>=2026.2.0",
  "pdfplumber>=0.11.9",
  "pixeltable-pgserver>=0.6,<0.7",
  "opentargets-mira>=1.0.3",
  "huggingface-hub>=0.32.4",
  "networkx>=3.6.1",
]

[dependency-groups]
dev = ["ruff>=0.15.17", "ty>=0.0.55"]
test = ["pytest>=9.0.3", "pytest-asyncio>=1.4.0", "pytest-mock>=3.15.1", "pytest-split>=0.11.0"]

[project.optional-dependencies]
baseline_expression = ["scanpy>=1.10.0", "cellex"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
cellex = { git = "https://github.com/perslab/CELLEX", rev = "119c7ca" }

[project.scripts]
pts = "pts.core:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: mark a test as slow (deselect with '-m \"not slow\"')",
  "pgserver: starts a real postgres server (deselect with '-m \"not pgserver\"')",
]

[tool.ruff]
extend = "../ruff.toml"

# Fix spark functions being flagged as missing arguments
# https://github.com/astral-sh/ty/issues/2759
[[tool.ty.overrides]]
include = ["src/pts/pyspark/**/*.py", "tests/**/*.py"]
[tool.ty.overrides.rules]
missing-argument = "ignore"
invalid-argument-type = "ignore"
