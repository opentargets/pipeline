[project]
name = "pos"
version = "26.12.0rc1"
description = "Open Targets Pipeline Output Stage"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "click-default-group>=1.2.4",
    "clickhouse-connect>=0.8.17",
    "docker>=7.1.0",
    "google-cloud-bigquery>=3.34.0",
    "google-cloud-compute>=1.31.0",
    "loguru>=0.7.3",
    "mlcroissant>=1.0.17",
    "opensearch-py>=3.0.0",
    "opentargets-otter>=26.9.1",
    "orjson>=3.10.18",
    "paramiko>=4.0.0",
    "polars>=1.31.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.0",
    "pyyaml>=6.0.2",
    "python-box>=7.3.2",
    "rich>=14.0.0",
    "smart-open>=7.1.0",
    "typer>=0.16.0",
]

[dependency-groups]
dev = ["ruff==0.16.10", "ty==0.0.85", "deptry>=0.23.0", "types-docker>=7.1.0"]
test = ["pytest>=9.0.3", "pytest-mock>=3.14.1"]

[project.scripts]
ot_croissant = "pos.croissant.app:main"
p2j = "pos.parquet2json.cli:app"
pos = "pos.core:pos"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pos"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../ruff.toml"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
