[project]
name = "pos"
version = "26.12.0rc32"
description = "Open Targets Pipeline Output Stage"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "clickhouse-connect>=0.8.17",
    "google-cloud-bigquery>=3.34.0",
    "loguru>=0.7.3",
    "mlcroissant>=1.0.17",
    "ot-datamodels",
    "opensearch-py>=3.0.0",
    "opentargets-otter>=26.9.1",
    "paramiko>=4.0.0",
    "pyarrow>=25.0.1",
    "pydantic>=2.0",
    "python-box>=7.3.2",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = ["ruff==0.16.10", "ty==0.0.85", "deptry>=0.23.0"]
test = ["pytest>=9.0.3", "pytest-mock>=3.14.1"]

[tool.uv.sources]
ot-datamodels = { path = "../datamodels", editable = true }

[project.scripts]
ot_croissant = "pos.croissant.app:main"
pos = "pos.core:main"
pos-ddl = "pos.clickhouse_ddl:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pos"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../ruff.toml"

[tool.deptry.per_rule_ignores]
# python-box imports yaml for its from_yaml
DEP002 = ["pyyaml"]
