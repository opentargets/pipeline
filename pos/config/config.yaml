---
# Platform Output Support. Run with `pos -s <step> -r <release_uri>`: pos.run derives
# release, data_source, database_namespace, product and the product's fixed values from it.
# A task with `products:` runs only for those products.
work_path: ./work
log_level: DEBUG
scratchpad:
  local_data: release_data
  ftp_sync_path_gcs_credentials_file: gs://open-targets-ops/credentials/pis-service_account.json

steps:
  ##################################################################################################
  # Release candidate: ClickHouse and OpenSearch data on their running servers
  ##################################################################################################
  backend_clickhouse:
    - name: sync_bucket etl output files
      requires:
        - clickhouse_create_database release database
      source: ${data_source}/output
      destination: ${local_data}/output
    - name: sync_bucket etl view files
      requires:
        - clickhouse_create_database release database
      source: ${data_source}/view
      destination: ${local_data}/view
    # clickhouse
    - name: clickhouse_create_database release database
      clickhouse_database: ${database_namespace}
      exist_ok: true
    # tables declared on the models; the explode below runs the serving scripts after them
    - name: explode load declared datasets
      requires:
        - sync_bucket etl output files
        - sync_bucket etl view files
        - clickhouse_create_database release database
      foreach:
        - baseline_expression
        - biosample
        - clinical_indication
        - clinical_report
        - clinical_target
        - enhancer_to_gene
        - evidence
        - go
        - hpo
        - literature_entity_lut
        - otar_projects
        - so
        - target_essentiality
        - w2v
      do:
        - name: clickhouse_load clickhouse load ${each}
          dataset: ${each}
          clickhouse_database: ${database_namespace}
          data_dir_parent: ${local_data}
          product: ${product}
    - name: explode load all datasets
      requires:
        - explode load declared datasets
      foreach:
        - colocalisation
        - disease_hpo
        - drug_warnings
        - mechanism_of_action
        - mouse_phenotypes
        - pharmacovigilance
        - protein_coding_coords
        - transcript
      do:
        - name: clickhouse_load clickhouse load ${each}
          dataset: ${each}
          clickhouse_database: ${database_namespace}
          data_dir_parent: ${local_data}
          product: ${product}
    - name: clickhouse_load clickhouse load credible_set_variant
      requires:
        - sync_bucket etl output files
        - sync_bucket etl view files
        - clickhouse_create_database release database
      dataset: credible_set_variant
      clickhouse_database: ${database_namespace}
      data_dir_parent: ${local_data}
      product: ${product}
    - name: clickhouse_load clickhouse load interaction_evidence
      requires:
        - sync_bucket etl output files
        - sync_bucket etl view files
        - clickhouse_create_database release database
      dataset: interaction_evidence
      clickhouse_database: ${database_namespace}
      data_dir_parent: ${local_data}
      product: ${product}
    - name: clickhouse_load clickhouse load l2g_predictions
      requires:
        - sync_bucket etl output files
        - sync_bucket etl view files
        - clickhouse_create_database release database
      dataset: l2g_predictions
      clickhouse_database: ${database_namespace}
      data_dir_parent: ${local_data}
      product: ${product}
    - name: clickhouse_load clickhouse load pharmacogenomics
      requires:
        - sync_bucket etl output files
        - sync_bucket etl view files
        - clickhouse_create_database release database
      dataset: pharmacogenomics
      clickhouse_database: ${database_namespace}
      data_dir_parent: ${local_data}
      product: ${product}
    - name: clickhouse_load clickhouse load association_time_series
      products: [ppp]
      requires:
        - sync_bucket etl output files
        - sync_bucket etl view files
        - clickhouse_create_database release database
      dataset: association_time_series
      clickhouse_database: ${database_namespace}
      data_dir_parent: ${local_data}
      product: ${product}
    - name: clickhouse_load clickhouse target_prioritisation
      requires:
        - explode load declared datasets
      dataset: target_prioritisation
      clickhouse_database: ${database_namespace}
      data_dir_parent: ${local_data}
      product: ${product}
    - name: clickhouse_load clickhouse load interaction
      requires:
        - clickhouse_load clickhouse load interaction_evidence
      dataset: interaction
      clickhouse_database: ${database_namespace}
      data_dir_parent: ${local_data}
      product: ${product}
    - name: clickhouse_load clickhouse load credible_sets
      requires:
        - clickhouse_load clickhouse load credible_set_variant
      dataset: credible_sets
      clickhouse_database: ${database_namespace}
      data_dir_parent: ${local_data}
      product: ${product}
    - name: clickhouse_load clickhouse load variants
      requires:
        - clickhouse_load clickhouse load pharmacogenomics
        - clickhouse_load clickhouse load credible_sets
      dataset: variants
      clickhouse_database: ${database_namespace}
      data_dir_parent: ${local_data}
      product: ${product}
    - name: clickhouse_load clickhouse load studies
      requires:
        - clickhouse_load clickhouse load credible_sets
      dataset: studies
      clickhouse_database: ${database_namespace}
      data_dir_parent: ${local_data}
      product: ${product}
    - name: clickhouse_load clickhouse load drug
      requires:
        - clickhouse_load clickhouse load pharmacogenomics
      dataset: drug
      clickhouse_database: ${database_namespace}
      data_dir_parent: ${local_data}
      product: ${product}
    - name: clickhouse_load clickhouse load targets
      requires:
        - clickhouse_load clickhouse load pharmacogenomics
        - clickhouse_load clickhouse load studies
        - clickhouse_load clickhouse load disease
      dataset: targets
      clickhouse_database: ${database_namespace}
      data_dir_parent: ${local_data}
      product: ${product}
    - name: clickhouse_load clickhouse load disease
      requires:
        - clickhouse_load clickhouse load studies
      dataset: disease
      clickhouse_database: ${database_namespace}
      data_dir_parent: ${local_data}
      product: ${product}
    - name: clickhouse_load clickhouse load aotf
      requires:
        - clickhouse_load clickhouse load disease
      dataset: aotf
      clickhouse_database: ${database_namespace}
      data_dir_parent: ${local_data}
      product: ${product}
    - name: clickhouse_load clickhouse load variant_credible_sets
      requires:
        - clickhouse_load clickhouse load credible_sets
        - explode load declared datasets
        - clickhouse_load clickhouse load studies
        - clickhouse_load clickhouse load targets
        - clickhouse_load clickhouse load disease
        - clickhouse_load clickhouse load variants
        - clickhouse_load clickhouse load l2g_predictions
      dataset: variant_credible_sets
      clickhouse_database: ${database_namespace}
      data_dir_parent: ${local_data}
      product: ${product}
    - name: clickhouse_load clickhouse load study_credible_sets
      requires:
        - clickhouse_load clickhouse load credible_sets
        - clickhouse_load clickhouse load targets
        - clickhouse_load clickhouse load variants
        - clickhouse_load clickhouse load l2g_predictions
      dataset: study_credible_sets
      clickhouse_database: ${database_namespace}
      data_dir_parent: ${local_data}
      product: ${product}
    - name: clickhouse_load clickhouse load target_credible_sets
      requires:
        - clickhouse_load clickhouse load credible_sets
        - clickhouse_load clickhouse load targets
        - clickhouse_load clickhouse load variants
        - clickhouse_load clickhouse load studies
        - explode load declared datasets
      dataset: target_credible_sets
      clickhouse_database: ${database_namespace}
      data_dir_parent: ${local_data}
      product: ${product}
    - name: clickhouse_load clickhouse credible_sets_build_cleanup
      requires:
        - clickhouse_load clickhouse load variant_credible_sets
        - clickhouse_load clickhouse load study_credible_sets
        - clickhouse_load clickhouse load target_credible_sets
      dataset: credible_sets_build_cleanup
      clickhouse_database: ${database_namespace}
      data_dir_parent: ${local_data}
      product: ${product}

  backend_opensearch:
    - name: sync_bucket etl output files
      requires:
        - open_search_prepare cluster settings
      source: ${data_source}/output
      destination: ${local_data}/output
    - name: sync_bucket etl export files
      requires:
        - open_search_prepare cluster settings
      source: ${data_source}/export
      destination: ${local_data}/export
    # ot croissant
    - name: ot_croissant generate release metadata
      requires:
        - sync_bucket etl output files
      ftp_address: ${croissant_ftp_address}
      gcp_address: ${release_gcs_bucket}/${release}/output/
      aws_address: ${croissant_aws_address}
      dataset_path: ${local_data}/output
      output: croissant.json
      prepared_data_parent: ${local_data}
    # opensearch
    - name: open_search_prepare cluster settings
      prefix: ${database_namespace}
    - name: explode load all opensearch datasets
      requires:
        - open_search_prepare cluster settings
        - sync_bucket etl export files
        - ot_croissant generate release metadata
      foreach:
        - croissant
        - facet_search_disease
        - facet_search_target
        - search_disease
        - search_drug
        - search_study
        - search_target
        - search_variant
      do:
        - name: open_search_create_index ${each}
          dataset: ${each}
          prefix: ${database_namespace}
        - name: open_search_load dataset ${each}
          requires:
            - open_search_create_index ${each}
          dataset: ${each}
          prefix: ${database_namespace}
          json_parent: ${local_data}
    - name: open_search_finish no query-insights indices
      requires:
        - explode load all opensearch datasets

  ##################################################################################################
  # Release
  ##################################################################################################
  tarballs:
    - name: tarball opensearch
      source: /mnt/opensearch
      destination: disk_images/opensearch.tgz
    - name: tarball clickhouse
      source: /mnt/clickhouse
      destination: disk_images/clickhouse.tgz
  bigquery:
    - name: bigquery_load release tables
      products: [platform]
      release_uri: ${data_source}
      release: ${release}
      project_id: ${bigquery_project}
      dataset_id: ${bigquery_dataset}
      staging_dataset_id: ${bigquery_staging_dataset}
      location: ${bigquery_location}
  gcs_sync:
    - name: sync_bucket gcs release data
      source: ${data_source}/
      destination: ${release_gcs_bucket}/${release}/
  aws_sync:
    - name: rclone_sync aws release data
      products: [platform]
      scratch: skip
      source: gcs:${data_source}/
      destination: aws:${aws_address}/${release}/
  # manual
  ftp_sync:
    - name: ftp_sync release data to ftp server
      products: [platform]
      scratch: skip
      source_data: ${data_source}
      release_id: ${release}
      gcs_credentials_file_remote: ${ftp_sync_path_gcs_credentials_file}
  # last, after every other step
  publish_manifest:
    - name: rclone_copyto manifest to gcs
      source: ${run_location}/manifest.json
      destination: ${release_gcs_bucket}/${release}/manifest.json
    - name: rclone_copyto manifest to aws
      products: [platform]
      scratch: skip
      source: ${run_location}/manifest.json
      destination: ${aws_address}/${release}/manifest.json
  # scratch mode only, Platform only
  scratch_cleanup:
    - name: bigquery_drop_datasets scratch datasets
      products: [platform]
      scratch: only
      project_id: ${bigquery_project}
      dataset_ids:
        - ${bigquery_dataset}
        - ${bigquery_staging_dataset}
