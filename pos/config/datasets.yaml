---
# The OpenSearch indices. input_dir is relative to the synced release data; croissant is written by ot_croissant.
# ClickHouse tables are declared on the served view models (`clickhouse = Serving(...)`, pos.clickhouse_ddl).
opensearch:
  croissant:
    index: downloads
    id_value: croissant
    input_dir: croissant
    mappings: config/opensearch/default.json
  facet_search_disease:
    index: facet_search_disease
    input_dir: export/search_facet_disease
    mappings: config/opensearch/facet_search.json
  facet_search_target:
    index: facet_search_target
    input_dir: export/search_facet_target
    mappings: config/opensearch/facet_search.json
  search_disease:
    index: search_disease
    input_dir: export/search_disease
    mappings: config/opensearch/search.json
  search_drug:
    index: search_drug
    input_dir: export/search_drug
    mappings: config/opensearch/search.json
  search_study:
    index: search_study
    input_dir: export/search_study
    mappings: config/opensearch/search.json
  search_target:
    index: search_target
    input_dir: export/search_target
    mappings: config/opensearch/search.json
  search_variant:
    index: search_variant
    input_dir: export/search_variant
    mappings: config/opensearch/search.json
