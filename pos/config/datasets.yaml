---
# input_dir is relative to the synced release data; croissant is written by ot_croissant.
# A clickhouse entry with `model:` (or `models:`, a glob) gets its landing table from the ot_datamodels model
# (`pos-ddl <dataset>` prints it); `engine:` defaults to Log. Derived entries run their `preload_script`.
opensearch:
  croissant:
    index: downloads
    id_value: croissant
    input_dir: croissant
    mappings: config/opensearch/default.json
  facet_search_disease:
    index: facet_search_disease
    input_dir: export/search_facet_disease
    mappings: config/opensearch/facet_search.json
  facet_search_target:
    index: facet_search_target
    input_dir: export/search_facet_target
    mappings: config/opensearch/facet_search.json
  search_disease:
    index: search_disease
    input_dir: export/search_disease
    mappings: config/opensearch/search.json
  search_drug:
    index: search_drug
    input_dir: export/search_drug
    mappings: config/opensearch/search.json
  search_study:
    index: search_study
    input_dir: export/search_study
    mappings: config/opensearch/search.json
  search_target:
    index: search_target
    input_dir: export/search_target
    mappings: config/opensearch/search.json
  search_variant:
    index: search_variant
    input_dir: export/search_variant
    mappings: config/opensearch/search.json
clickhouse:
  aotf:
    table: associations_otf_log
    input_dir: view/association_otf
    model: association_otf
    postload_script: config/clickhouse/scripts/aotf.sql
  baseline_expression:
    table: baseline_expression_log
    input_dir: output/baseline_expression
    model: baseline_expression
  biosample:
    table: biosample_log
    input_dir: output/biosample
    model: biosample
  colocalisation:
    table: colocalisation_log
    input_dir: output/colocalisation
    model: colocalisation
    postload_script: config/clickhouse/scripts/colocalisation.sql
  # credible_set_variant has no postload script: credible_sets builds its tables from both _log tables.
  credible_set_variant:
    table: credible_set_variant_log
    input_dir: output/credible_set_variant
    model: credible_set_variant
    engine: MergeTree ORDER BY (credibleSetId, variantId)
  credible_sets:
    table: credible_sets_log
    input_dir: output/credible_set
    model: credible_set
    postload_script: config/clickhouse/scripts/credible_sets.sql
  disease:
    table: disease_log
    input_dir: output/disease
    model: disease
    postload_script: config/clickhouse/scripts/disease.sql
  disease_hpo:
    table: disease_hpo_log
    input_dir: output/disease_phenotype
    model: disease_phenotype
    postload_script: config/clickhouse/scripts/disease_hpo.sql
  drug:
    table: drug_log
    input_dir: output/drug_molecule
    model: drug_molecule
    postload_script: config/clickhouse/scripts/drug.sql
  drug_warnings:
    table: drug_warnings_log
    input_dir: output/drug_warning
    model: drug_warning
    postload_script: config/clickhouse/scripts/drug_warnings.sql
  enhancer_to_gene:
    table: enhancer_to_gene_log
    input_dir: output/enhancer_to_gene
    model: enhancer_to_gene
  evidence:
    table: evidence_log
    input_dir: output
    models: 'evidence_*'
    # each member gets its own table, then all load into evidence_log; list here the members allowed to have no output
    optional_models: []
    # built from evidence_log, the union
    clickhouse:
      - {name: evidence, engine: rocksdb}
      - name: evidence_by_variant
        engine: mergetree
        order_by: [datasourceId, variantId, score]
        columns: [datasourceId, variantId, score, id]
        where: variantId IS NOT NULL
      - name: evidence_by_disease_and_target
        engine: mergetree
        order_by: [datasourceId, diseaseId, targetId, score]
        columns: [datasourceId, diseaseId, targetId, score, id]
        where: diseaseId IS NOT NULL AND targetId IS NOT NULL
  go:
    table: gene_ontology_log
    input_dir: output/go
    model: go
  interaction:
    table: interaction_log
    input_dir: output/interaction
    model: interaction
    postload_script: config/clickhouse/scripts/interaction.sql
  interaction_evidence:
    table: interaction_evidence_log
    input_dir: output/interaction_evidence
    model: interaction_evidence
    postload_script: config/clickhouse/scripts/interaction_evidence.sql
  hpo:
    table: hpo_log
    input_dir: output/disease_hpo
    model: disease_hpo
  l2g_predictions:
    table: l2g_predictions_log
    input_dir: output/l2g_prediction
    model: l2g_prediction
    postload_script: config/clickhouse/scripts/l2g_predictions.sql
  literature_entity_lut:
    table: literature_entity_lut_log
    input_dir: output/literature_entity_lut
    model: literature_entity_lut
  mechanism_of_action:
    table: mechanism_of_action_log
    input_dir: output/drug_mechanism_of_action
    model: drug_mechanism_of_action
    postload_script: config/clickhouse/scripts/mechanism_of_action.sql
  mouse_phenotypes:
    table: mouse_phenotypes_log
    input_dir: output/mouse_phenotype
    model: mouse_phenotype
    postload_script: config/clickhouse/scripts/mouse_phenotypes.sql
  association_time_series:
    table: association_time_series_log
    input_dir: view/association_timeseries
    model: association_timeseries
  pharmacovigilance:
    table: pharmacovigilance_log
    input_dir: output/pharmacovigilance
    model: pharmacovigilance
    postload_script: config/clickhouse/scripts/pharmacovigilance.sql
  otar_projects:
    table: otar_projects_log
    input_dir: output/otar
    optional: true
    model: otar
  pharmacogenomics:
    table: pharmacogenomics_log
    input_dir: output/pharmacogenomics
    model: pharmacogenomics
    postload_script: config/clickhouse/scripts/pharmacogenomics.sql
  protein_coding_coords:
    table: protein_coding_coords_log
    input_dir: view/coding_variant
    model: coding_variant
    postload_script: config/clickhouse/scripts/protein_coding_coords.sql
  w2v:
    table: ml_w2v_log
    input_dir: output/literature_vector
    model: literature_vector
  studies:
    table: studies_log
    input_dir: output/study
    model: study
    postload_script: config/clickhouse/scripts/studies.sql
  so:
    table: sequence_ontology_log
    input_dir: output/so
    model: so
  target_essentiality:
    table: target_essentiality_log
    input_dir: output/target_essentiality
    model: target_essentiality
  target_prioritisation:
    table: target_prioritisation_log
    input_dir: output/target_prioritisation
    model: target_prioritisation
    postload_script: config/clickhouse/scripts/target_prioritisation.sql
  targets:
    table: targets_log
    input_dir: view/target_view
    model: target_view
    postload_script: config/clickhouse/scripts/targets.sql
  transcript:
    table: transcript_log
    input_dir: output/transcript
    model: transcript
    postload_script: config/clickhouse/scripts/transcript.sql
  variants:
    table: variants_log
    input_dir: output/variant
    model: variant
    postload_script: config/clickhouse/scripts/variants.sql
  # Built by its preload script from loaded tables.
  variant_credible_sets:
    table: variant_credible_sets
    derived: true
    preload_script: config/clickhouse/scripts/variant_credible_sets.sql
  study_credible_sets:
    table: study_credible_sets
    derived: true
    preload_script: config/clickhouse/scripts/study_credible_sets.sql
  target_credible_sets:
    table: target_credible_sets
    derived: true
    preload_script: config/clickhouse/scripts/target_credible_sets.sql
  # Drops the _mergetree inputs of the three credible-set read models.
  credible_sets_build_cleanup:
    table: credible_sets_build_cleanup
    derived: true
    preload_script: config/clickhouse/scripts/credible_sets_build_cleanup.sql
  clinical_indication:
    table: clinical_indication_log
    input_dir: output/clinical_indication
    model: clinical_indication
  clinical_report:
    table: clinical_report_log
    input_dir: output/clinical_report
    model: clinical_report
  clinical_target:
    table: clinical_target_log
    input_dir: output/clinical_target
    model: clinical_target
