---
work_path: ../work
log_level: DEBUG
pool_size: 4

# Defaults for local runs. Orchestration overrides these with the scratchpad of the
# selected environment of each staging DAG's config.yaml.
scratchpad:
  decode_data_path: output/decode
  decode_input_path: input/decode
  decode_molecular_complex_version: '2026-01-09'
  eqtl_catalogue_credible_set_glob: input/eqtl_catalogue/susie/*/*/*.credible_sets.parquet
  eqtl_catalogue_credible_set_path: output/eqtl_catalogue/credible_set
  eqtl_catalogue_lbf_glob: input/eqtl_catalogue/susie/*/*/*.lbf_variable.parquet
  eqtl_catalogue_metadata_uri: input/eqtl_catalogue/dataset_metadata.tsv
  eqtl_catalogue_study_index_path: output/eqtl_catalogue/study_index
  finngen_curation_tag: '26.05'
  finngen_input_path: input/finngen
  finngen_path: output/finngen
  finngen_ukb_mvp_meta_path: output/finngen_ukb_mvp_meta
  foldx_path: input/foldx
  gnomad_path: input/gnomad
  gwas_catalog_curation_date: '20260812'
  gwas_catalog_ftp: ftp://ftp.ebi.ac.uk/pub/databases/gwas/releases
  gwas_catalog_input_path: input/gwas_catalog
  gwas_catalog_stats_uri: https://www.ebi.ac.uk/gwas/api/search/stats
  gwas_catalog_sumstats_pics_path: output/gwas_catalog_sumstats_pics
  gwas_catalog_susie_path: output/gwas_catalog_sumstats_susie
  gwas_catalog_sync_date: '20260802'
  gwas_catalog_top_hits_path: output/gwas_catalog_top_hits
  lof_curation_path: input/lof_curation
  ukb_ppp_eur_input_path: output/ukb_ppp_eur_inputs
  ukb_ppp_eur_path: output/ukb_ppp_eur
  ukb_ppp_eur_tmp_path: input/ukb_ppp_eur_tmp

steps:
  #: GWAS_CATALOG_RELEASE STEP :######################################################################
  # Runs on a VM, not Dataproc: syncs the latest GWAS Catalog release and prepares the study curation.
  gwas_catalog_release:
    - name: crawl release metadata
      stats_uri: ${gwas_catalog_stats_uri}
      destination_template: '${gwas_catalog_input_path}/gentroutils/{release_date}/stats.json'
      promote: true

    - name: fetch studies
      stats_uri: ${gwas_catalog_stats_uri}
      source_template: '${gwas_catalog_ftp}/{release_date}/gwas-catalog-download-studies-v1.0.3.1.txt'
      destination_template: '${gwas_catalog_input_path}/gentroutils/{release_date}/gwas_catalog_download_studies.tsv'
      promote: true

    - name: fetch ancestries
      stats_uri: ${gwas_catalog_stats_uri}
      source_template: '${gwas_catalog_ftp}/{release_date}/gwas-catalog-download-ancestries-v1.0.3.1.txt'
      destination_template: '${gwas_catalog_input_path}/gentroutils/{release_date}/gwas_catalog_download_ancestries.tsv'
      promote: true

    - name: fetch associations
      stats_uri: ${gwas_catalog_stats_uri}
      source_template: '${gwas_catalog_ftp}/{release_date}/gwas-catalog-associations_ontology-annotated-full.zip'
      destination_template: '${gwas_catalog_input_path}/gentroutils/{release_date}/gwas_catalog_associations_ontology_annotated.tsv'
      promote: true

    - name: curation study
      requires:
        - fetch studies
      previous_curation: '${gwas_catalog_input_path}/curation/latest/curated/GWAS_Catalog_study_curation.tsv'
      studies: '${gwas_catalog_input_path}/gentroutils/latest/gwas_catalog_download_studies.tsv'
      summary_statistics_glob: '${gwas_catalog_input_path}/raw_summary_statistics/**.h.tsv.gz'
      destination_template: '${gwas_catalog_input_path}/curation/{release_date}/raw/GWAS_Catalog_study_curation.tsv'
      promote: true
  ##################################################################################################

  #: GWAS_CATALOG_TOP_HITS_INGESTION STEP :###########################################################
  gwas_catalog_top_hits_ingestion:
    - name: pyspark gwas catalog top hit ingestion
      step: gwas_catalog.top_hit_ingestion
      session:
        write_mode: overwrite
        output_partitions: 1
      settings:
        catalog_study_files:
          - ${gwas_catalog_input_path}/gentroutils/${gwas_catalog_sync_date}/gwas_catalog_download_studies.tsv
        catalog_ancestry_files:
          - ${gwas_catalog_input_path}/gentroutils/${gwas_catalog_sync_date}/gwas_catalog_download_ancestries.tsv
        catalog_associations_file: ${gwas_catalog_input_path}/gentroutils/${gwas_catalog_sync_date}/gwas_catalog_associations_ontology_annotated.tsv
        variant_annotation_path: ${gnomad_path}/v4.1/variant_index
        catalog_studies_out: ${gwas_catalog_top_hits_path}/study_index
        catalog_associations_out: ${gwas_catalog_top_hits_path}/study_locus_window_based_clumped
  ##################################################################################################

  #: GWAS_CATALOG_TOP_HITS_LD_CLUMPING STEP :#########################################################
  gwas_catalog_top_hits_ld_clumping:
    - name: pyspark ld clumping of gwas catalog top hits
      step: shared.ld_clumping
      session:
        write_mode: overwrite
      settings:
        study_locus_input_path: ${gwas_catalog_top_hits_path}/study_locus_window_based_clumped
        study_index_path: ${gwas_catalog_top_hits_path}/study_index
        ld_index_path: ${gnomad_path}/v2.1.1/ld_index
        clumped_study_locus_output_path: ${gwas_catalog_top_hits_path}/study_locus_ld_clumped
  ##################################################################################################

  #: GWAS_CATALOG_TOP_HITS_PICS STEP :################################################################
  gwas_catalog_top_hits_pics:
    - name: pyspark pics of gwas catalog top hits
      step: shared.pics
      session:
        write_mode: overwrite
      settings:
        study_locus_ld_annotated_in: ${gwas_catalog_top_hits_path}/study_locus_ld_clumped
        picsed_study_locus_out: ${gwas_catalog_top_hits_path}/credible_sets
  ##################################################################################################

  #: FOLDX_INGESTION :##############################################################################
  foldx_ingestion:
    - name: pyspark foldx ingestion
      step: foldx.ingestion
      settings:
        foldx_dataset_path: ${foldx_path}/foldx_export.parquet
        plddt_threshold: 0.7
        annotation_path: ${foldx_path}/foldx_variant_annotation
  ##################################################################################################

  #: EQTL_CATALOGUE_INGESTION :#####################################################################
  eqtl_catalogue_ingestion:
    - name: pyspark eqtl catalogue ingestion
      step: eqtl_catalogue.ingestion
      session:
        write_mode: overwrite
        output_partitions: 50
        extended_spark_conf:
          spark.sql.shuffle.partitions: '2000'
      settings:
        eqtl_catalogue_dataset_metadata_path: ${eqtl_catalogue_metadata_uri}
        credible_set_input_glob: ${eqtl_catalogue_credible_set_glob}
        lbf_variable_input_glob: ${eqtl_catalogue_lbf_glob}
        study_index_output_path: ${eqtl_catalogue_study_index_path}
        credible_set_output_path: ${eqtl_catalogue_credible_set_path}
        lead_pvalue_threshold: 0.001
        mqtl_quantification_methods_blacklist: []
  ##################################################################################################

  #: GWAS_CATALOG_SUMSTATS_SUSIE_FINEMAPPING :######################################################
  gwas_catalog_susie_credible_set_qc:
    - name: pyspark gwas catalog susie credible set qc
      step: shared.credible_set_qc
      session:
        write_mode: overwrite
        start_hail: true
      settings:
        credible_sets_path: ${gwas_catalog_susie_path}/credible_set_datasets
        output_path: ${gwas_catalog_susie_path}/credible_set_clean/20260901
        p_value_threshold: 1.0e-05
        purity_min_r2: 0.25
        n_partitions: 350
        clump: false
  ##################################################################################################

  #: GNOMAD_INGESTION :#############################################################################
  gnomad_ld_index:
    - name: pyspark gnomad ld index
      step: gnomad.ld_index
      session:
        start_hail: true
      settings:
        ld_index_out: ${gnomad_path}/ld_index/v2.1.1
  gnomad_variant_index:
    - name: pyspark gnomad variant index
      step: gnomad.variant_index
      session:
        start_hail: true
      settings:
        variant_annotation_path: ${gnomad_path}/v4.1/variant_index
  ##################################################################################################

  #: FINNGEN_INGESTION :############################################################################
  finngen_studies:
    - name: pyspark finngen studies
      step: finngen.studies
      session:
        start_hail: true
        write_mode: overwrite
      settings:
        finngen_study_index_out: ${finngen_path}/study_index
        finngen_phenotype_table_url: https://r12.finngen.fi/api/phenos
        finngen_release_prefix: FINNGEN_R12
        finngen_summary_stats_url_prefix: ${finngen_input_path}/summary_stats/finngen_R12_
        sample_size: 500348
        finngen_summary_stats_url_suffix: .gz
        efo_curation_mapping_url: https://raw.githubusercontent.com/opentargets/curation/refs/tags/${finngen_curation_tag}/mappings/disease/manual_string.tsv
  finngen_finemapping_ingestion:
    - name: pyspark finngen finemapping ingestion
      step: finngen.finemapping_ingestion
      session:
        start_hail: true
        write_mode: overwrite
      settings:
        finngen_finemapping_out: ${finngen_path}/credible_set_datasets/susie
        finngen_susie_finemapping_snp_files: ${finngen_input_path}/finemap/full/susie/*.snp.bgz
        finngen_susie_finemapping_cs_summary_files: ${finngen_input_path}/finemap/summary/*SUSIE.cred.summary.tsv
        finngen_finemapping_lead_pvalue_threshold: 1e-5
        finngen_release_prefix: FINNGEN_R12
  ##################################################################################################

  #: GWAS_CATALOG_SUMSTATS_PICS :###################################################################
  gwas_catalog_sumstats_pics_study_index:
    - name: pyspark gwas catalog sumstats pics study index
      step: gwas_catalog.study_index
      session:
        write_mode: overwrite
        output_partitions: 1
      settings:
        catalog_study_files:
          - ${gwas_catalog_input_path}/gentroutils/${gwas_catalog_sync_date}/gwas_catalog_download_studies.tsv
        catalog_ancestry_files:
          - ${gwas_catalog_input_path}/gentroutils/${gwas_catalog_sync_date}/gwas_catalog_download_ancestries.tsv
        study_index_path: ${gwas_catalog_sumstats_pics_path}/study_index
  gwas_catalog_sumstats_pics_window_clumping:
    - name: pyspark gwas catalog sumstats pics window clumping
      step: shared.window_clumping
      session:
        start_hail: true
        write_mode: overwrite
        extended_spark_conf:
          spark.shuffle.mapOutput.minSizeForBroadcast: 20m
      settings:
        summary_statistics_input_path: ${gwas_catalog_input_path}/harmonised_summary_statistics
        study_locus_output_path: ${gwas_catalog_sumstats_pics_path}/study_locus_window_based_clumped
  gwas_catalog_sumstats_pics_ld_clumping:
    - name: pyspark gwas catalog sumstats pics ld clumping
      step: shared.ld_clumping
      session:
        write_mode: overwrite
        extended_spark_conf:
          spark.shuffle.mapOutput.minSizeForBroadcast: 20m
      settings:
        ld_index_path: gs://gnomad_data_2/v2.1.1/ld_index
        study_locus_input_path: ${gwas_catalog_sumstats_pics_path}/study_locus_window_based_clumped
        clumped_study_locus_output_path: ${gwas_catalog_sumstats_pics_path}/study_locus_ld_clumped
        study_index_path: ${gwas_catalog_sumstats_pics_path}/study_index
  gwas_catalog_sumstats_pics_pics:
    - name: pyspark gwas catalog sumstats pics pics
      step: shared.pics
      session:
        write_mode: overwrite
      settings:
        study_locus_ld_annotated_in: ${gwas_catalog_sumstats_pics_path}/study_locus_ld_clumped
        picsed_study_locus_out: ${gwas_catalog_sumstats_pics_path}/credible_sets
  ##################################################################################################

  #: GWAS_CATALOG_SUMSTATS_SUSIE_CLUMPING :#########################################################
  gwas_catalog_susie_study_index:
    - name: pyspark gwas catalog susie study index
      step: gwas_catalog.study_index
      session:
        write_mode: overwrite
        output_partitions: 1
      settings:
        catalog_study_files:
          - ${gwas_catalog_input_path}/gentroutils/${gwas_catalog_sync_date}/gwas_catalog_download_studies.tsv
        catalog_ancestry_files:
          - ${gwas_catalog_input_path}/gentroutils/${gwas_catalog_sync_date}/gwas_catalog_download_ancestries.tsv
        study_index_path: ${gwas_catalog_susie_path}/study_index
        gwas_catalog_study_curation_file: ${gwas_catalog_input_path}/curation/${gwas_catalog_curation_date}/curated/GWAS_Catalog_study_curation.tsv
        sumstats_qc_path: ${gwas_catalog_input_path}/summary_statistics_qc
  gwas_catalog_susie_locus_breaker_clumping:
    - name: pyspark gwas catalog susie locus breaker clumping
      step: shared.locus_breaker_clumping
      session:
        extended_spark_conf:
          spark.sql.sources.parallelPartitionDiscovery.parallelism: '100000'
        write_mode: overwrite
      settings:
        summary_statistics_input_path: ${gwas_catalog_input_path}/harmonised_summary_statistics/*/*.parquet
        clumped_study_locus_output_path: ${gwas_catalog_susie_path}/study_locus_lb_clumped_${gwas_catalog_sync_date}
        lbc_baseline_pvalue: 1.0e-05
        lbc_distance_cutoff: 250000
        lbc_pvalue_threshold: 1.0e-08
        lbc_flanking_distance: 100000
        large_loci_size: 1500000
        wbc_clump_distance: 500000
        wbc_pvalue_threshold: 1.0e-08
        collect_locus: true
        remove_mhc: true
  ##################################################################################################

  #: FINNGEN_UKB_MVP_META :#########################################################################
  finngen_ukb_mvp_meta_harmonisation:
    - name: pyspark finngen ukb mvp meta harmonisation
      step: finngen_ukb_mvp_meta.ingestion
      session:
        use_enhanced_bgzip_codec: true
        write_mode: overwrite
        extended_spark_conf:
          spark.executor.memory: 25g
          spark.executor.cores: '7'
          spark.driver.memory: 25g
      settings:
        source_manifest_path: ${finngen_input_path}/meta_analysis/mvp_ukbb/FinnGen_R12_MVP_UKBB_manifest.tsv
        efo_curation_path: https://raw.githubusercontent.com/opentargets/curation/refs/tags/25.09/mappings/disease/manual_string.tsv
        gnomad_variant_index_path: ${gnomad_path}/v4.1/variant_index/
        study_index_output_path: ${finngen_ukb_mvp_meta_path}/study_index/
        raw_summary_statistics_output_path: ${finngen_ukb_mvp_meta_path}/raw_summary_statistics/
        harmonised_summary_statistics_output_path: ${finngen_ukb_mvp_meta_path}/harmonised_summary_statistics/
        harmonised_summary_statistics_qc_output_path: ${finngen_ukb_mvp_meta_path}/harmonised_summary_statistics_qc/
        perform_meta_analysis_filter: true
        imputation_score_threshold: 0.8
        perform_imputation_score_filter: true
        min_allele_count_threshold: 20
        perform_min_allele_count_filter: true
        min_allele_frequency_threshold: 0.0001
        perform_min_allele_frequency_filter: false
        filter_out_ambiguous_variants: false
  finngen_ukb_mvp_meta_window_clumping:
    - name: pyspark finngen ukb mvp meta window clumping
      step: shared.window_clumping
      session:
        start_hail: true
        write_mode: overwrite
        extended_spark_conf:
          spark.executor.memory: 25g
          spark.executor.cores: '4'
          spark.shuffle.mapOutput.minSizeForBroadcast: 10m
      settings:
        summary_statistics_input_path: ${finngen_ukb_mvp_meta_path}/harmonised_summary_statistics
        study_locus_output_path: ${finngen_ukb_mvp_meta_path}/study_locus_window_based_clumped
  finngen_ukb_mvp_meta_ld_clumping:
    - name: pyspark finngen ukb mvp meta ld clumping
      step: shared.ld_clumping
      session:
        write_mode: overwrite
        extended_spark_conf:
          spark.executor.memory: 25g
          spark.executor.cores: '4'
          spark.shuffle.mapOutput.minSizeForBroadcast: 10m
      settings:
        ld_index_path: ${gnomad_path}/v2.1.1/ld_index
        study_locus_input_path: ${finngen_ukb_mvp_meta_path}/study_locus_window_based_clumped
        study_index_path: ${finngen_ukb_mvp_meta_path}/study_index
        clumped_study_locus_output_path: ${finngen_ukb_mvp_meta_path}/study_locus_ld_clumped
  finngen_ukb_mvp_meta_pics:
    - name: pyspark finngen ukb mvp meta pics
      step: shared.pics
      session:
        write_mode: overwrite
      settings:
        study_locus_ld_annotated_in: ${finngen_ukb_mvp_meta_path}/study_locus_ld_clumped
        picsed_study_locus_out: ${finngen_ukb_mvp_meta_path}/credible_sets
  ##################################################################################################

  #: UKB_PPP_EUR_HARMONISATION :####################################################################
  ukb_ppp_eur_harmonisation:
    - name: pyspark ukb ppp eur harmonisation
      step: ukb_ppp_eur.sumstat_preprocess
      session:
        write_mode: overwrite
      settings:
        raw_study_index_path_from_tsv: ${ukb_ppp_eur_tmp_path}/batch/output/ukb_ppp_eur/study_index.tsv
        raw_summary_stats_path: ${ukb_ppp_eur_tmp_path}/batch/output/ukb_ppp_eur/summary_stats.parquet
        tmp_variant_annotation_path: ${ukb_ppp_eur_tmp_path}/variant_annotation
        variant_annotation_path: ${gnomad_path}/gnomad_variant_index
        study_index_output_path: ${ukb_ppp_eur_path}/study_index
        summary_stats_output_path: ${ukb_ppp_eur_input_path}/harmonised_summary_statistics
  ukb_ppp_eur_locus_breaker_clumping:
    - name: pyspark ukb ppp eur locus breaker clumping
      step: shared.locus_breaker_clumping
      session:
        write_mode: overwrite
      settings:
        summary_statistics_input_path: ${ukb_ppp_eur_input_path}/harmonised_summary_statistics
        clumped_study_locus_output_path: ${ukb_ppp_eur_path}/study_locus_lb_clumped
        lbc_baseline_pvalue: 1.0e-05
        lbc_distance_cutoff: 250000
        lbc_pvalue_threshold: 1.7e-11
        lbc_flanking_distance: 100000
        large_loci_size: 1500000
        wbc_clump_distance: 500000
        wbc_pvalue_threshold: 1.7e-11
        collect_locus: true
        remove_mhc: true
  ##################################################################################################

  #: UKB_PPP_EUR_FINEMAPPING :######################################################################
  ukb_ppp_eur_credible_set_qc:
    - name: pyspark ukb ppp eur credible set qc
      step: shared.credible_set_qc
      session:
        write_mode: overwrite
        start_hail: true
      settings:
        credible_sets_path: ${ukb_ppp_eur_path}/credible_set_datasets/susie/20250129
        output_path: ${ukb_ppp_eur_path}/credible_set_clean/20250129
        p_value_threshold: 1.0e-05
        purity_min_r2: 0.25
        n_partitions: 50
        clump: false
  ##################################################################################################

  #: DECODE_INGESTION :#############################################################################
  decode_molecular_complex:
    - name: pyspark decode molecular complex
      step: molecular_complex.ingestion
      session:
        write_mode: overwrite
      settings:
        predicted_complex_tab_path: https://ftp.ebi.ac.uk/pub/databases/intact/complex/${decode_molecular_complex_version}/complextab/9606_predicted.tsv
        experimental_complex_tab_path: https://ftp.ebi.ac.uk/pub/databases/intact/complex/${decode_molecular_complex_version}/complextab/9606.tsv
        output_path: ${decode_data_path}/molecular_complex/
  decode_smp_manifest_generation:
    - name: pyspark decode smp manifest generation
      step: decode.manifest_generation
      session:
        write_mode: overwrite
        s3_configuration_path: /var/run/secrets/decode
        add_s3_connector: true
      settings:
        bucket_name: largescaleplasma-2023
        prefix: final_somascan_smp/
        output_path: ${decode_data_path}/smp/manifest/
  decode_smp_ingestion:
    - name: pyspark decode smp ingestion
      step: decode.summary_statistics_ingestion
      session:
        s3_configuration_path: /var/run/secrets/decode
        add_s3_connector: true
      settings:
        manifest_path: ${decode_data_path}/smp/manifest/
        raw_summary_statistics_path: ${decode_input_path}/raw_summary_statistics/smp/
  decode_smp_harmonisation:
    - name: pyspark decode smp harmonisation
      step: decode.summary_statistics_harmonisation
      session:
        write_mode: overwrite
      settings:
        raw_summary_statistics_path: ${decode_input_path}/raw_summary_statistics/smp/
        manifest_path: ${decode_data_path}/smp/manifest/
        aptamer_metadata_path: ${decode_data_path}/decode_2023_aptamer_mapping.tsv
        variant_direction_path: ${gnomad_path}/v4.1/variant_direction/
        molecular_complex_path: ${decode_data_path}/molecular_complex/
        harmonised_summary_statistics_path: ${decode_data_path}/smp/harmonised_summary_statistics/
        protein_qtl_study_index_path: ${decode_data_path}/smp/pqtl_study/
        perform_min_allele_count_filter: true
        min_mac_threshold: 50
        perform_sample_size_filter: true
        min_sample_size_threshold: 30000
        flipping_window_size: 10000000
        remove_equal_alleles: true
        remove_ambiguous_alleles: false
        verify_atgc: true
  decode_smp_qc:
    - name: pyspark decode smp qc
      step: decode.summary_statistics_qc
      session:
        write_mode: overwrite
      settings:
        harmonised_summary_statistics_path: ${decode_data_path}/smp/harmonised_summary_statistics/
        protein_qtl_study_index_path: ${decode_data_path}/smp/pqtl_study/
        qc_summary_statistics_path: ${decode_data_path}/smp/harmonised_summary_statistics_qc/
        protein_qtl_study_index_qc_annotated_path: ${decode_data_path}/smp/pqtl_study_qc_annotated/
        pval_threshold: 5e-8
  decode_smp_window_clumping:
    - name: pyspark decode smp window clumping
      step: shared.window_clumping
      session:
        start_hail: true
        write_mode: overwrite
      settings:
        summary_statistics_input_path: ${decode_data_path}/smp/harmonised_summary_statistics/
        study_locus_output_path: ${decode_data_path}/smp/study_locus_window_based_clumped/
        recursive_file_lookup: false
        gwas_significance: 1.8e-09
        distance: 1000000
        collect_locus: false
        collect_locus_distance: 500000
  decode_smp_ld_clumping:
    - name: pyspark decode smp ld clumping
      step: shared.ld_clumping
      session:
        write_mode: overwrite
      settings:
        ld_index_path: ${gnomad_path}/v2.1.1/ld_index/
        study_locus_input_path: ${decode_data_path}/smp/study_locus_window_based_clumped/
        study_index_path: ${decode_data_path}/smp/pqtl_study_qc_annotated/
        clumped_study_locus_output_path: ${decode_data_path}/smp/study_locus_ld_clumped/
  decode_smp_pics:
    - name: pyspark decode smp pics
      step: shared.pics
      session:
        write_mode: overwrite
      settings:
        study_locus_ld_annotated_in: ${decode_data_path}/smp/study_locus_ld_clumped/
        picsed_study_locus_out: ${decode_data_path}/smp/credible_set/
  decode_smp_pqtl_study_index:
    - name: pyspark decode smp pqtl study index
      step: shared.pqtl_study_index
      session:
        write_mode: overwrite
      settings:
        protein_study_index_path: ${decode_data_path}/smp/pqtl_study_qc_annotated/
        target_index_path: ${decode_data_path}/target/
