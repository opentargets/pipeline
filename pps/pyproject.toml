[project]
name = "PPS"
version = "26.9.0.dev0"
description = "Open Targets Pre-Pipeline Stage"
authors = [{ name = "Open Targets Core Team", email = "devs@opentargets.net" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }

dependencies = [
  "aioftp>=0.25.1",
  "aiohttp>=3.11.18",
  "delta-spark==3.2.0",
  "gcsfs>=2025.7.0",
  "gentropy",
  "google-cloud-storage>=3.11.0",
  "loguru>=0.7.3",
  "opentargets-otter>=26.9.1",
  "pandas>=2.2.0",
  "polars[fsspec]>=2.0.0",
  "pydantic>=2.11.0",
  "pyspark>=3.5.1,<3.6",
  "tqdm>=4.67.1",
]

[dependency-groups]
dev = ["ruff>=0.15.17", "ty>=0.0.55"]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.1.0",
]

# Temporary: local gentropy checkout until the trimmed-down gentropy is released.
[tool.uv.sources]
gentropy = { path = "/Users/ss60/Projects/gentropy/feat/migrate-studylocus-to-credible-set", editable = true }

[project.scripts]
pps = "pps.core:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["no_shared_spark: the test needs no spark session to exist"]

[tool.ruff]
extend = "../ruff.toml"
