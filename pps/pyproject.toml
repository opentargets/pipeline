[project]
name = "PPS"
version = "26.12.0rc0"
description = "Open Targets Pre-Pipeline Stage"
authors = [{ name = "Open Targets Core Team", email = "devs@opentargets.net" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }

dependencies = [
  "delta-spark==3.2.0",
  "google-cloud-storage>=3.11.0",
  "hail==0.2.139",
  "loguru>=0.7.3",
  "opentargets-otter>=26.9.1",
  "pandas>=2.2.0",
  "pydantic>=2.11.0",
  "pyspark>=3.5.1,<3.6",
]

[dependency-groups]
dev = ["ruff==0.16.10", "ty==0.0.85"]
test = [
    "pyarrow>=21.0.0",
    "pytest>=9.0.3",
]

[project.scripts]
pps = "pps.core:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["no_shared_spark: the test needs no spark session to exist"]

[tool.ruff]
extend = "../ruff.toml"
