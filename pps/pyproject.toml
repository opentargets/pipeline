[project]
name = "PPS"
version = "26.12.0rc0"
description = "Open Targets Pre-Pipeline Stage"
authors = [{ name = "Open Targets Core Team", email = "devs@opentargets.net" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }

dependencies = [
  "loguru>=0.7.3",
  "opentargets-otter>=26.9.1",
]

[dependency-groups]
dev = ["ruff==0.16.10", "ty==0.0.85"]
test = [
    "pytest>=9.0.3",
]

[project.scripts]
pps = "pps.core:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["no_shared_spark: the test needs no spark session to exist"]

[tool.ruff]
extend = "../ruff.toml"
