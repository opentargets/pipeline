---
description: Open Targets Genetics — SLE-map single-cell eQTL SuSiE fine-mapping ingestion
env: prod

environments:
  prod:
    input:
      # the SuSiE results of the new SLE-map fine-mapping run, uploaded on 2026-11-17; donor counts by cell type and ancestry added on 2026-11-20
      sle_map: gs://sle_map_data/raw_results/SLEmap_finemap_cond
    output: gs://sle_map_data/prod/20261120T134808
    scratchpad:
      # the head of opentargets/gentropy#1354 (sle_map_ingestion step); set to its tag before merge
      gentropy_ref: ccc0841003be719a1ff74f8fe39227ee721e0e24

setup:
  - from: https://raw.githubusercontent.com/opentargets/gentropy/{{gentropy_ref}}/utils/install_dependencies_on_cluster.sh
    to: '{{output}}/bin/install_dependencies_on_cluster.sh'
  - from: https://raw.githubusercontent.com/opentargets/gentropy/{{gentropy_ref}}/src/gentropy/cli.py
    to: '{{output}}/bin/cli.py'

infrastructure:
  clusters:
    otg-sle-map:
      project_id: open-targets-genetics-dev
      # a small fixed cluster: the three tables read are about 55 MB of TSV, and the full
      # data ran on local Spark in the gentropy PR
      master_machine_type: n2d-highmem-8
      master_disk_size: 128
      num_workers: 2
      worker_machine_type: n2d-highmem-8
      worker_disk_size: 128
      idle_delete_ttl: 1800
      metadata:
        GENTROPY_REF: '{{gentropy_ref}}'
      properties:
        # as the gentropy clusters of the unified pipeline
        'spark:spark.shuffle.service.enabled': 'true'
        'spark:spark.sql.adaptive.enabled': 'true'
        'spark:spark.sql.parquet.compression.codec': 'zstd'
      init_actions_uris:
        - '{{output}}/bin/install_dependencies_on_cluster.sh'

steps:
  ingestion:
    kind: dataproc
    definition:
      cluster: otg-sle-map
      main: '{{output}}/bin/cli.py'
      # Default filters of the step: purity min r2 >= 0.25 and lead p-value <= 1e-3.
      args: |
        step=sle_map_ingestion \
          step.memberships_path={{input.sle_map}}/all_memberships.tsv \
          step.components_path={{input.sle_map}}/all_components.tsv \
          step.diagnostics_path={{input.sle_map}}/all_diagnostics.tsv \
          step.donor_counts_path={{input.sle_map}}/donor_counts_by_cell_type_and_ancestry.tsv \
          step.study_index_output_path={{output}}/output/study \
          step.credible_set_output_path={{output}}/output/credible_set \
          step.credible_set_variant_output_path={{output}}/output/credible_set_variant \
          step.session.write_mode=overwrite \
          step.session.output_partitions=1 \
          step.session.spark_uri=yarn
