---
# The AACT monthly archive this pipeline extracts
aact_version: '2026-09-23'

# The clinical mining inputs (TTD, EMA, PMDA) this pipeline stages
clinical_mining_version: '2026-05-27'

# Where every snapshot and record store lives
bucket: 'gs://clinical_staging'

# Pipeline package versions
pis_version: '26.9.0.dev0.aacttest.1'
pts_version: '26.9.0.dev0.aacttest.6'

# Each step runs on its own machine, sized for the AACT archive plus its restore
machine_type: 'n1-standard-8'
boot_disk_size: 50
disk_size: 150

# Dependency graph
# ----------------
# Follows same standards as in unified_pipeline. `source` says which version
# directory the step reads and writes: `aact` or `clinical_mining`.
steps:
  pis_aact:
    source: aact

  pts_aact_trial_extraction:
    source: aact
    depends_on:
      - pis_aact
    machine_type: 'n1-highmem-8'
    # Fetched from Secret Manager onto the VM and mounted into the container at
    # this path — which is what LlmExtractSpec.openai_key_path defaults to. The
    # key itself never appears in config or in code.
    gce_secret_files:
      openai-token: /var/run/secrets/openai-api-key

  # Runs the stop-reasons and drug NER models over the AACT texts. CPU inference,
  # so it takes a larger machine than the IO-bound steps.
  pts_aact_trial_models:
    source: aact
    depends_on:
      - pts_aact_trial_extraction
    machine_type: 'n2d-standard-16'

  pis_clinical_mining:
    source: clinical_mining

  # Runs the drug and disease NER models over the TTD, EMA and PMDA texts.
  pts_clinical_mining_models:
    source: clinical_mining
    depends_on:
      - pis_clinical_mining
      - pts_aact_trial_models
    machine_type: 'n2d-standard-16'
