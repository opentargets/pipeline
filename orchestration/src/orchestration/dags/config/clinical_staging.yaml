---
# The date of the run. It names the AACT monthly archive and dates the TTD, EMA and
# PMDA downloads, and every source is staged under it.
staging_version: '2026-11-03'

# Where every snapshot and record store lives
bucket: 'gs://clinical_staging'

# Pipeline package versions
pis_version: '26.12.0rc17'
pts_version: '26.12.0rc28'

# Each step runs on its own machine, sized for the AACT archive plus its restore
machine_type: 'n1-standard-8'
boot_disk_size: 50
disk_size: 150

# Dependency graph
# ----------------
# Follows same standards as in unified_pipeline. `source` says which version
# directory the step reads and writes: `aact`, `clinical_mining` or `literature`.
steps:
  pis_aact:
    source: aact

  pts_aact_trial_extraction:
    source: aact
    depends_on:
      - pis_aact
    machine_type: 'n1-highmem-8'
    # Fetched from Secret Manager onto the VM and mounted into the container at
    # this path — which is what AactTrialExtractionSettings.openai_key_path defaults to. The
    # key itself never appears in config or in code.
    gce_secret_files:
      openai-token: /var/run/secrets/openai-api-key

  # Runs the stop-reasons and drug NER models over the AACT texts.
  pts_aact_trial_models:
    source: aact
    depends_on:
      - pts_aact_trial_extraction
    machine_type: 'n2d-standard-16'

  # Extracts the mechanisms of action of the drugs in the AACT trials with Claude.
  pts_aact_moa:
    source: aact
    depends_on:
      - pts_aact_trial_extraction
    machine_type: 'n1-highmem-8'
    execution_timeout_hours: 30
    container_env:
      ANTHROPIC_GOOGLE_CLOUD_WORKSPACE_ID: wrkspc_01PEuYsbEifFUZBttcpwP49Q
      ANTHROPIC_GOOGLE_CLOUD_PROJECT: open-targets-eu-dev

  pis_clinical_mining:
    source: clinical_mining

  # Runs the drug and disease NER models over the TTD, EMA and PMDA texts.
  pts_clinical_mining_models:
    source: clinical_mining
    depends_on:
      - pis_clinical_mining
      - pts_aact_trial_models
    machine_type: 'n2d-standard-16'

  # Extracts the mechanisms of action the literature states for each clinical drug with Claude. Reads
  # published releases only; its snapshot lands under gs://clinical_staging/literature/<release>.
  pts_moa_literature:
    source: literature
    machine_type: 'n2d-highmem-32'
    execution_timeout_hours: 30
    container_env:
      ANTHROPIC_GOOGLE_CLOUD_WORKSPACE_ID: wrkspc_01PEuYsbEifFUZBttcpwP49Q
      ANTHROPIC_GOOGLE_CLOUD_PROJECT: open-targets-eu-dev
