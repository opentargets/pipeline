---
# The AACT monthly archive this pipeline extracts
aact_version: '2026-08-01'

# Where snapshots and the extraction cache live
bucket: 'gs://aact_data'

# Pipeline package versions
pis_version: '26.9.0rc2'
pts_version: '26.9.0rc2'

# Each step runs on its own machine, sized for the AACT archive plus its restore
machine_type: 'n1-standard-8'
disk_size: 150

# Dependency graph
# ----------------
# Follows same standards as in unified_pipeline
steps:
  pis_aact_tables:

  pts_aact_trial_extraction:
    depends_on:
      - pis_aact_tables
    # Fetched from Secret Manager onto the VM and mounted into the container at
    # this path — which is what LlmExtractSpec.openai_key_path defaults to. The
    # key itself never appears in config or in code.
    gce_secret_files:
      openai-api-key: /var/run/secrets/openai-api-key
