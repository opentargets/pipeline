---
steps:
  # PPP adds the curated LoF annotations to the variant index.
  variant:
    - name: transform FoldX annotations
      source: input/variant/foldx
      destination: intermediate/variant/foldx
      transformer: foldx
      settings:
        plddt_threshold: 0.7

    - name: transform variant index
      requires:
        - transform FoldX annotations
      transformer: variant
      source:
        uniprot_variants: input/evidence/uniprot_variants.json.gz
        eva: input/evidence/eva.json.gz
        pharmacogenomics: output/pharmacogenomics
        credible_set_variant: intermediate/validated/credible_set_variant
        fasta: input/variant/reference/Homo_sapiens.GRCh38.dna.primary_assembly.fa.gz
        gff3: input/variant/reference/Homo_sapiens.GRCh38.116.gff3.gz
        gerp: input/variant/gerp/gerp_conservation_scores.homo_sapiens.GRCh38.bw
        vep_cache: input/variant/vep_cache/homo_sapiens_vep_116_GRCh38.tar.gz
        sift_predictions: input/variant/variation/protein_function_predictions.txt.gz
        sift_translation_md5: input/variant/variation/translation_md5.txt.gz
        sift_attrib: input/variant/variation/attrib.txt.gz
        peptides: input/variant/reference/Homo_sapiens.GRCh38.pep.all.fa.gz
        alphamissense: input/variant/alphamissense/AlphaMissense_hg38.tsv.gz
        alphamissense_isoforms: input/variant/alphamissense/AlphaMissense_isoforms_hg38.tsv.gz
        ancestor: input/variant/loftee/human_ancestor.fa.gz
        core: input/ensembl/homo_sapiens
        variant_annotations:
          - input/variant/gnomad
          - intermediate/variant/lof_curation
        amino_acid_annotations:
          - intermediate/variant/foldx
        gpn_star: input/variant/gpn_star
      destination:
        output: output/variant
      settings:
        hash_threshold: 300
        parallel_chromosomes: 8
        parallel_chunks: 32
        # songlab/gpn-star-scores@204d08a92bdf07117f5d869db667c45f9029ed48: genome-wide quantiles 0.1 / 0.01 / 0.001 and minimum
        # measured with cutoffs_from_histogram(llr_histogram(sorted(gpn_star_files(<mirror>).values())))
        gpn_star:
          top_10_percent: -2.392
          top_1_percent: -5.448
          top_0_1_percent: -9.851
          minimum: -13.698

  # PPP validates its own study and credible-set inputs instead of the platform molQTL sources.
  study:
    - name: transform validate study
      source:
        study:
          - input/gwas/gcca/study
          - input/gwas/gcss_pics/study
          - input/gwas/gcss_susie/study
          - input/gwas/finngen_gwas/study
          - input/molqtl/ukb_ppp_eur/study
          - input/molqtl/finngen_multiome/study
          - input/molqtl/sle_map/study
          # GWAS PPP
          - input/gwas/finngen_meta/study
          # molQTL PPP
          - input/molqtl/eqtl_catalogue/study
          - input/molqtl/otar2077/microglia/study
          - input/molqtl/eQTLGen/single_cell_eqtl/study
          - input/molqtl/eQTLGen/coeqtl/study
          - input/molqtl/deCODE_proteomics/study
        target: output/target
        disease: output/disease
        biosample: output/biosample
        heritability: input/heritability_estimate
      destination:
        output: output/study
        excluded: excluded/study
      transformer: study
      settings:
        invalid_qc_reasons:
          - UNRESOLVED_TARGET
          - UNRESOLVED_DISEASE
          - UNKNOWN_STUDY_TYPE
          - DUPLICATED_STUDY
          - UNKNOWN_BIOSAMPLE
          - FAILED_MEAN_BETA_CHECK
          - FAILED_PZ_CHECK
          - FAILED_GC_LAMBDA_CHECK
          - NO_OT_CURATION
          - CASE_CASE_STUDY_DESIGN
          - DEPRECATED_PROJECT
        deprecated_project_ids:
          - GTEx

  # PPP runs the platform credible set step on the platform and the PPP sources. Keep it identical
  # to the platform step apart from the sources; orchestration tests check it.
  credible_set:
    - name: explode qc credible sets
      foreach:
        - gwas/gcca
        - gwas/gcss_pics
        - gwas/gcss_susie
        - gwas/finngen_gwas
        - gwas/finngen_meta
        - molqtl/eqtl_catalogue
        - molqtl/ukb_ppp_eur
        - molqtl/finngen_multiome
        - molqtl/otar2077/microglia
        - molqtl/eQTLGen/single_cell_eqtl
        - molqtl/eQTLGen/coeqtl
        - molqtl/deCODE_proteomics
        - molqtl/sle_map
      do:
        - name: transform qc credible sets ${each}
          transformer: credible_set.set_qc
          source:
            credible_set: input/${each}/credible_set
            study: output/study
          destination: intermediate/qc/${each}/credible_set
          settings:
            allowed_fm_methods:
              - PICS
              - SuSiE
              - SuSiE-inf

        - name: transform qc credible set variants ${each}
          transformer: credible_set.variant_qc
          source:
            credible_set_variant: input/${each}/credible_set_variant
          destination: intermediate/qc/${each}/credible_set_variant
          settings:
            coverage: 0.95
            pip_tolerance: 0.0001

    - name: transform validate credible sets
      requires:
        - explode qc credible sets
      transformer: credible_set.validation
      source:
        credible_set:
          - intermediate/qc/gwas/gcca/credible_set
          - intermediate/qc/gwas/gcss_pics/credible_set
          - intermediate/qc/gwas/gcss_susie/credible_set
          - intermediate/qc/gwas/finngen_gwas/credible_set
          - intermediate/qc/gwas/finngen_meta/credible_set
          - intermediate/qc/molqtl/eqtl_catalogue/credible_set
          - intermediate/qc/molqtl/ukb_ppp_eur/credible_set
          - intermediate/qc/molqtl/finngen_multiome/credible_set
          - intermediate/qc/molqtl/otar2077/microglia/credible_set
          - intermediate/qc/molqtl/eQTLGen/single_cell_eqtl/credible_set
          - intermediate/qc/molqtl/eQTLGen/coeqtl/credible_set
          - intermediate/qc/molqtl/deCODE_proteomics/credible_set
          - intermediate/qc/molqtl/sle_map/credible_set
        credible_set_variant:
          - intermediate/qc/gwas/gcca/credible_set_variant
          - intermediate/qc/gwas/gcss_pics/credible_set_variant
          - intermediate/qc/gwas/gcss_susie/credible_set_variant
          - intermediate/qc/gwas/finngen_gwas/credible_set_variant
          - intermediate/qc/gwas/finngen_meta/credible_set_variant
          - intermediate/qc/molqtl/eqtl_catalogue/credible_set_variant
          - intermediate/qc/molqtl/ukb_ppp_eur/credible_set_variant
          - intermediate/qc/molqtl/finngen_multiome/credible_set_variant
          - intermediate/qc/molqtl/otar2077/microglia/credible_set_variant
          - intermediate/qc/molqtl/eQTLGen/single_cell_eqtl/credible_set_variant
          - intermediate/qc/molqtl/eQTLGen/coeqtl/credible_set_variant
          - intermediate/qc/molqtl/deCODE_proteomics/credible_set_variant
          - intermediate/qc/molqtl/sle_map/credible_set_variant
      destination:
        valid_set: intermediate/validated/credible_set
        valid_variant: intermediate/validated/credible_set_variant
        excluded_set: excluded/credible_set
        excluded_variant: excluded/credible_set_variant
      settings:
        cs_invalid_qc_reasons:
          - INVALID_CS_ID
          - IN_MHC
          - INVALID_CHROMOSOME
          - LEAD_CHROMOSOME_MISMATCH
          - TOP_HIT_AND_SUMMARY_STATS
          - MISSING_STUDY
          - REDUNDANT_PICS_TOP_HIT
          - DUPLICATED_CREDIBLE_SET_ID_ACROSS_SOURCES
          - INVALID_FINEMAPPING_METHOD
          - EXPLAINED_BY_SUSIE
          - COMPOSITE_FLAG
          - INCONSISTENCY_FLAG
          - SUBSIGNIFICANT_FLAG
          - LD_CLUMPED
          - WINDOW_CLUMPED
          - STUDY_TYPE_MISMATCH
          - LEAD_VARIANT_MISSING
        # ABNORMAL_PIP is not listed: sets with abnormal PIP sums are flagged and kept.
        csv_set_invalid_qc_reasons:
          - INVALID_CS_ID
          - INVALID_VARIANT_ID
          - DUPLICATED_VARIANT
        csv_row_invalid_qc_reasons:
          - EXCEEDS_COVERAGE_95
          - ORPHAN_VARIANT
