---
steps:

  colocalisation:
    params:
      step: colocalisation
      step.session.write_mode: overwrite
      step.session.output_partitions: 200
      step.colocalisation_method: coloc_pip_ecaviar
      +step.session.extended_spark_conf: >-
        {spark.executor.memory: '22g', spark.executor.memoryOverhead: '4g', spark.executor.cores: '4', spark.memory.fraction: '0.8', spark.memory.storageFraction: '0.2'}
      # INPUTS
      step.credible_set_path: '{{release_uri}}/output/credible_set'
      step.credible_set_variant_path: '{{release_uri}}/output/credible_set_variant'
      # OUTPUTS
      step.coloc_path: '{{release_uri}}/output/colocalisation'

  l2g_feature_matrix:
    params:
      step: locus_to_gene_feature_matrix
      step.session.write_mode: overwrite
      +step.session.extended_spark_conf: '{spark.sql.autoBroadcastJoinThreshold:''-1''}'
      # INPUTS
      step.credible_set_path: '{{release_uri}}/output/credible_set'
      step.credible_set_variant_path: '{{release_uri}}/output/credible_set_variant'
      step.variant_index_path: '{{release_uri}}/output/variant'
      step.colocalisation_path: '{{release_uri}}/output/colocalisation'
      step.study_index_path: '{{release_uri}}/output/study'
      step.target_index_path: '{{release_uri}}/output/target'
      step.intervals_path: '{{release_uri}}/output/enhancer_to_gene'
      step.gene_interactions_path: '{{release_uri}}/output/interaction'
      # OUTPUTS
      step.feature_matrix_path: '{{release_uri}}/intermediate/l2g_feature_matrix'

  l2g_effector_gene_list:
    params:
      step: effector_gene_list
      step.session.write_mode: overwrite
      step.session.output_partitions: 1
      # Keeps the top tier of every curated source and ClinVar pathogenic calls with stated criteria.
      step.rare_variant_score_threshold: 0.91
      # INPUTS
      # Rare-variant evidence, one path per datasource; filtered on step.rare_variant_score_threshold.
      step.rare_variant_evidence_paths:
        - '{{release_uri}}/output/evidence_eva'
        - '{{release_uri}}/output/evidence_genomics_england'
        - '{{release_uri}}/output/evidence_clingen'
        - '{{release_uri}}/output/evidence_gene2phenotype'
        - '{{release_uri}}/output/evidence_orphanet'
        - '{{release_uri}}/output/evidence_uniprot_variants'
        - '{{release_uri}}/output/evidence_uniprot_literature'
      step.clinical_evidence_path: '{{release_uri}}/output/evidence_clinical_precedence'
      # Approved stages only; see #333.
      step.approved_clinical_phases:
        - PHASE_4
        - APPROVAL
        - PREAPPROVAL
      # Legacy OTG gold standard curation with remapped disease ids; pis_l2g stages it.
      step.gold_standard_path: '{{release_uri}}/input/l2g/otg_gold_standard.json'
      # OUTPUTS
      step.effector_gene_list_path: '{{release_uri}}/intermediate/l2g_effector_gene_list'

  l2g_training_set:
    params:
      step: training_set
      step.session.write_mode: overwrite
      step.session.output_partitions: 1
      # Matches the old training set.
      step.interaction_score_threshold: 0.8
      # Keep only credible sets flagged REPLICATED by pts_credible_set_annotation. Required for production.
      step.apply_replication_filter: true
      # INPUTS
      step.feature_matrix_path: '{{release_uri}}/intermediate/l2g_feature_matrix'
      # Validated credible sets; the training set keeps the ones flagged REPLICATED.
      step.credible_set_path: '{{release_uri}}/output/credible_set'
      step.study_index_path: '{{release_uri}}/output/study'
      step.effector_gene_list_path: '{{release_uri}}/intermediate/l2g_effector_gene_list'
      step.interaction_path: '{{release_uri}}/output/interaction'
      # OUTPUTS
      step.training_set_path: '{{release_uri}}/intermediate/l2g_training_set'

