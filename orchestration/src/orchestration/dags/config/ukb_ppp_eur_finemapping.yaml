---
environment_specs:
  - name: Prod
    vars:
      root_path: gs://ukb_ppp_eur_data
      date: '20250129'
      gentropy_ref: '2.0.2-rc.2'
  - name: Test
    vars:
      root_path: gs://ot_orchestration/test/ukb_ppp_eur_data
      date: '20250129'
      gentropy_ref: '2.0.2-rc.2'

env: Prod

dataproc:
  cluster_name: otg-credible-set-qc
  cluster_config:
    project_id: open-targets-genetics-dev
    metadata:
      GENTROPY_REF: v3.2.0
    init_actions_uris:
      - 'gs://genetics_etl_python_playground/initialisation/install_dependencies_on_cluster.sh'
    autoscaling_policy: otg-etl

nodes:
  - id: generate_finemapping_index
    kind: Task
    prerequisites: []
    google_batch_index_specs:
      pointer: finemapping
      max_task_count: 40000
      generator_specs:
        generator_options:
          collected_loci_path: '{root_path}/study_locus_lb_clumped'
          manifest_output_path: '{root_path}/finemapping_manifests/{date}/manifest.csv'
          output_path: '{root_path}/credible_set_datasets/susie/{date}'
          log_path: '{root_path}/finemapping_logs/{date}'

  - id: finemapping_batch_job
    kind: Task
    prerequisites:
      - generate_finemapping_index
    google_batch:
      job:
        task_group:
          parallelism: 40000
          task_environments:
            environments: [] # populated at runtime by BatchIndexOperator
          task_config:
            max_retry_count: 5
            max_run_duration: '7200s'
            instance_resource_spec:
              cpu_milli: 4000
              memory_mib: 25000
              boot_disk_mib: 20000
            runnable_spec:
              image_uri: 'europe-west1-docker.pkg.dev/open-targets-genetics-dev/gentropy-app/gentropy:{gentropy_ref}'
              entrypoint: /bin/sh
              script_file: susie_finemap.sh
              script_variables:
                study_index_path: '{root_path}/study_index'
                study_locus_manifest_path: '{root_path}/finemapping_manifests/{date}/manifest.csv'
        allocation:
          instance:
            machine_type: n2-highmem-4
            provisioning_model: SPOT
        logs: {}

  - id: ukb_ppp_eur_data_credible_set_qc
    kind: Task
    prerequisites:
      - finemapping_batch_job
    params:
      step: credible_set_qc
      step.credible_sets_path: gs://ukb_ppp_eur_data/credible_set_datasets/susie/20250129
      step.output_path: gs://ukb_ppp_eur_data/credible_set_clean/20250129
      step.p_value_threshold: 1.0e-5
      step.purity_min_r2: 0.25
      step.n_partitions: 50
      step.clump: false
      step.session.write_mode: overwrite
      step.session.start_hail: true
