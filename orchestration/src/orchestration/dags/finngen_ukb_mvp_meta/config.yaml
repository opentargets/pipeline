---
env: prod
environments:
  - name: prod
    scratchpad:
      finngen_input_path: gs://finngen-public-data-r12
      finngen_ukb_mvp_meta_path: gs://finngen_ukb_mvp_meta_data
      gnomad_path: gs://gnomad_data_2
description: Open Targets Genetics — FinnGen, UKB and MVP meta-analysis ingestion and fine-mapping
staging_bucket: gs://genetics_etl_python_playground/pps
pps_version: 26.9.0.dev0
infrastructure:
  clusters:
    otg-finngen-ukb-meta:
      project_id: open-targets-genetics-dev
      autoscaling_policy: otg-etl
      num_workers: 2
      jars:
        bgzip:
          - org.seqdoop:hadoop-bam:7.10.0
          - com.github.samtools:htsjdk:2.13.2
        hail: []
steps:
  finngen_ukb_mvp_meta_harmonisation:
    cluster: otg-finngen-ukb-meta
  finngen_ukb_mvp_meta_window_clumping:
    cluster: otg-finngen-ukb-meta
    depends_on:
      - finngen_ukb_mvp_meta_harmonisation
  finngen_ukb_mvp_meta_ld_clumping:
    cluster: otg-finngen-ukb-meta
    depends_on:
      - finngen_ukb_mvp_meta_window_clumping
  finngen_ukb_mvp_meta_pics:
    cluster: otg-finngen-ukb-meta
    depends_on:
      - finngen_ukb_mvp_meta_ld_clumping
