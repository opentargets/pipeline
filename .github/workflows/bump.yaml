---
name: Bump RC

on:
  push:
    branches:
      - main
  # lets a skipped or failed release be rerun by hand
  workflow_dispatch:

concurrency:
  group: bump-rc
  cancel-in-progress: false

jobs:
  bump:
    name: Bump RC
    runs-on: ubuntu-latest
    # scripts/pr.py pushes its version bumps to main as the bot, so skip those to
    # avoid retriggering this workflow. every other commit releases.
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.head_commit.author.name != 'opentargets-gitbot[bot]'
    steps:
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          prune-cache: true # v9 flipped the default; keep the cache free of pre-built wheels

      - name: Bump, tag and push
        run: |
          git config user.name "opentargets-gitbot[bot]"
          git config user.email "opentargets-gitbot[bot]@users.noreply.github.com"
          uv run ./scripts/pr.py
