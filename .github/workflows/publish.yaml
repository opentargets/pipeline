---
name: Publish

on:
  workflow_call:
    inputs:
      final:
        description: 'Whether this is a final release.'
        required: true
        type: boolean
      package:
        description: 'Package to publish.'
        required: true
        type: string
      version:
        description: 'Version to publish.'
        required: true
        type: string

jobs:
  publish:
    name: Build & push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: branch-tag
        if: ${{ !inputs.final }}
        run: |
          echo "tag=$(echo "${{ inputs.version }}" | sed -E 's/\.dev[0-9]+//; s/\.[^.]+$//')" >> "$GITHUB_OUTPUT"

      - id: auth-ghcr
        if: ${{ inputs.final }}
        name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - id: auth-google-cache
        name: Authenticate to Google Cloud (cache read)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          project_id: 'open-targets-eu-dev'
          workload_identity_provider: projects/426265110888/locations/global/workloadIdentityPools/github-actions/providers/opentargets
          service_account: github-actions@open-targets-eu-dev.iam.gserviceaccount.com
          access_token_lifetime: 600s

      - id: auth-gar-cache
        name: Log in to Google Artifact Registry (cache read)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth-google-cache.outputs.access_token }}

      - id: build
        name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ inputs.package }}
          platforms: linux/amd64,linux/arm64
          push: false
          target: ${{ inputs.package == 'pts' && 'lean' || '' }}
          cache-from: type=registry,ref=europe-west1-docker.pkg.dev/open-targets-eu-dev/${{ github.event.repository.name }}/buildcache:${{ inputs.package }}-${{ inputs.package == 'pts' && 'lean' || 'default' }}

      - id: auth-google
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          token_format: access_token
          project_id: 'open-targets-eu-dev'
          workload_identity_provider: projects/426265110888/locations/global/workloadIdentityPools/github-actions/providers/opentargets
          service_account: github-actions@open-targets-eu-dev.iam.gserviceaccount.com
          access_token_lifetime: 600s

      - id: auth-gar
        name: Log in to Google Artifact Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth-google.outputs.access_token }}

      - id: push-dev
        if: ${{ !inputs.final }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ inputs.package }}
          platforms: linux/amd64,linux/arm64
          push: true
          target: ${{ inputs.package == 'pts' && 'lean' || '' }}
          cache-from: type=registry,ref=europe-west1-docker.pkg.dev/open-targets-eu-dev/${{ github.event.repository.name }}/buildcache:${{ inputs.package }}-${{ inputs.package == 'pts' && 'lean' || 'default' }}
          cache-to: type=registry,ref=europe-west1-docker.pkg.dev/open-targets-eu-dev/${{ github.event.repository.name }}/buildcache:${{ inputs.package }}-${{ inputs.package == 'pts' && 'lean' || 'default' }},mode=max,image-manifest=true,oci-mediatypes=true
          tags: |
            europe-west1-docker.pkg.dev/open-targets-eu-dev/${{ github.event.repository.name }}/${{ inputs.package }}:${{ inputs.version }}
            europe-west1-docker.pkg.dev/open-targets-eu-dev/${{ github.event.repository.name }}/${{ inputs.package }}:${{ steps.branch-tag.outputs.tag }}

      - id: push-final
        if: ${{ inputs.final }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./${{ inputs.package }}
          platforms: linux/amd64,linux/arm64
          push: true
          target: ${{ inputs.package == 'pts' && 'lean' || '' }}
          cache-from: type=registry,ref=europe-west1-docker.pkg.dev/open-targets-eu-dev/${{ github.event.repository.name }}/buildcache:${{ inputs.package }}-${{ inputs.package == 'pts' && 'lean' || 'default' }}
          cache-to: type=registry,ref=europe-west1-docker.pkg.dev/open-targets-eu-dev/${{ github.event.repository.name }}/buildcache:${{ inputs.package }}-${{ inputs.package == 'pts' && 'lean' || 'default' }},mode=max,image-manifest=true,oci-mediatypes=true
          tags: |
            ghcr.io/${{ github.repository }}/${{ inputs.package }}:${{ inputs.version }}
            ghcr.io/${{ github.repository }}/${{ inputs.package }}:latest
            europe-west1-docker.pkg.dev/open-targets-eu-dev/${{ github.event.repository.name }}/${{ inputs.package }}:${{ inputs.version }}
            europe-west1-docker.pkg.dev/open-targets-eu-dev/${{ github.event.repository.name }}/${{ inputs.package }}:latest

      - id: push-dev-nlp
        if: ${{ !inputs.final && inputs.package == 'pts' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./pts
          platforms: linux/amd64,linux/arm64
          push: true
          target: nlp
          cache-from: type=registry,ref=europe-west1-docker.pkg.dev/open-targets-eu-dev/${{ github.event.repository.name }}/buildcache:pts-nlp
          cache-to: type=registry,ref=europe-west1-docker.pkg.dev/open-targets-eu-dev/${{ github.event.repository.name }}/buildcache:pts-nlp,mode=max,image-manifest=true,oci-mediatypes=true
          tags: |
            europe-west1-docker.pkg.dev/open-targets-eu-dev/${{ github.event.repository.name }}/pts-nlp:${{ inputs.version }}
            europe-west1-docker.pkg.dev/open-targets-eu-dev/${{ github.event.repository.name }}/pts-nlp:${{ steps.branch-tag.outputs.tag }}

      - id: push-final-nlp
        if: ${{ inputs.final && inputs.package == 'pts' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./pts
          platforms: linux/amd64,linux/arm64
          push: true
          target: nlp
          cache-from: type=registry,ref=europe-west1-docker.pkg.dev/open-targets-eu-dev/${{ github.event.repository.name }}/buildcache:pts-nlp
          cache-to: type=registry,ref=europe-west1-docker.pkg.dev/open-targets-eu-dev/${{ github.event.repository.name }}/buildcache:pts-nlp,mode=max,image-manifest=true,oci-mediatypes=true
          tags: |
            ghcr.io/${{ github.repository }}/pts-nlp:${{ inputs.version }}
            ghcr.io/${{ github.repository }}/pts-nlp:latest
            europe-west1-docker.pkg.dev/open-targets-eu-dev/${{ github.event.repository.name }}/pts-nlp:${{ inputs.version }}
            europe-west1-docker.pkg.dev/open-targets-eu-dev/${{ github.event.repository.name }}/pts-nlp:latest

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ inputs.final }}
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ inputs.package }}
          subject-digest: ${{ steps.push-final.outputs.digest }}
          push-to-registry: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ inputs.final && inputs.package == 'pts' }}
        with:
          subject-name: ghcr.io/${{ github.repository }}/pts-nlp
          subject-digest: ${{ steps.push-final-nlp.outputs.digest }}
          push-to-registry: true
