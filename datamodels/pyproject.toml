[project]
name = "ot-datamodels"
version = "26.12.0rc10"
description = "Open Targets dataset models"
authors = [{ name = "Open Targets Core Team", email = "devs@opentargets.net" }]
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }

dependencies = ["polars>=1.41.2", "pydantic>=2.13.4"]

[tool.uv]
# moved together with the polars major by Renovate (#146)
constraint-dependencies = ["polars<3"]

[dependency-groups]
dev = ["ruff==0.16.10", "ty==0.0.85"]
test = ["pytest>=9.0.3"]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ot_datamodels"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../ruff.toml"
