[project]
name = "PIS"
version = "26.12.0rc46"
description = "Open Targets Pipeline Input Stage"
authors = [{ name = "Open Targets Core Team", email = "devs@opentargets.net" }]
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Apache-2.0" }

dependencies = [
  "jq>=1.11.0",
  "loguru>=0.7.3",
  "opentargets-otter>=26.9.1",
  "requests>=2.34.2",
  "urllib3>=2.7.0",
]

[dependency-groups]
dev = ["ruff==0.16.10", "ty==0.0.85", "vulture==2.16"]
test = ["pytest>=9.0.3"]

[project.scripts]
pis = "pis.core:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend = "../ruff.toml"
extend-exclude = ["vulture_whitelist.py"] # bare names that vulture reads as uses

[tool.ty.src]
exclude = ["vulture_whitelist.py"]

[tool.vulture]
paths = ["src", "vulture_whitelist.py"]
min_confidence = 60
ignore_names = ["model_post_init", "main", "validate", "scratchpad_ignore_missing"]
